<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Rail Rush 3D</title>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 width:100%;
 height:100%;
 overflow:hidden;
 background:#071326;
 font-family:Arial,Helvetica,sans-serif;
 touch-action:none;
 user-select:none;
}

#game{
 position:fixed;
 inset:0;
 overflow:hidden;
}

canvas{
 display:block;
 width:100%;
 height:100%;
}

#hud{
 position:absolute;
 top:14px;
 left:14px;
 right:14px;
 z-index:10;
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 pointer-events:none;
}

.hudLeft{
 display:flex;
 flex-direction:column;
 gap:5px;
}

.hudBox{
 background:rgba(7,18,39,.78);
 border:2px solid rgba(255,255,255,.22);
 border-radius:15px;
 padding:8px 13px;
 color:#fff;
 font-weight:900;
 backdrop-filter:blur(8px);
 box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.score{
 font-size:20px;
}

.coins{
 color:#ffd42b;
 font-size:17px;
}

#pause{
 pointer-events:auto;
 width:50px;
 height:50px;
 border:0;
 border-radius:15px;
 background:rgba(255,255,255,.9);
 color:#16233b;
 font-size:22px;
 font-weight:1000;
 box-shadow:0 5px 18px rgba(0,0,0,.3);
}

#powerBar{
 position:absolute;
 left:50%;
 bottom:20px;
 transform:translateX(-50%);
 z-index:10;
 display:flex;
 gap:7px;
 flex-wrap:wrap;
 justify-content:center;
 pointer-events:none;
}

.power{
 display:none;
 padding:7px 12px;
 border-radius:18px;
 background:rgba(5,18,40,.86);
 border:2px solid rgba(255,255,255,.18);
 color:#fff;
 font-size:13px;
 font-weight:900;
 box-shadow:0 5px 20px rgba(0,0,0,.25);
}

#message{
 position:absolute;
 top:43%;
 left:50%;
 transform:translate(-50%,-50%);
 z-index:20;
 display:none;
 color:#fff;
 font-size:38px;
 font-weight:1000;
 text-align:center;
 text-shadow:0 4px 15px #000;
 pointer-events:none;
 white-space:nowrap;
}

.overlay{
 position:absolute;
 inset:0;
 z-index:30;
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
 background:
 radial-gradient(circle at 50% 20%,rgba(40,140,255,.25),transparent 40%),
 linear-gradient(180deg,#091c3d,#050d1c);
}

.panel{
 width:min(92%,400px);
 padding:28px 22px;
 border-radius:25px;
 background:rgba(8,23,49,.94);
 border:2px solid rgba(255,255,255,.14);
 box-shadow:0 20px 60px rgba(0,0,0,.45);
 color:#fff;
}

.logo{
 font-size:42px;
 font-weight:1000;
 color:#ffd52d;
 letter-spacing:-2px;
 text-shadow:
 0 4px 0 #dc7100,
 0 7px 15px rgba(0,0,0,.5);
}

.subtitle{
 margin-top:10px;
 color:#c9d8ed;
 line-height:1.5;
}

.startBtn{
 margin-top:22px;
 width:100%;
 min-height:55px;
 border:0;
 border-radius:17px;
 background:linear-gradient(135deg,#ffd027,#ff7600);
 color:#281600;
 font-size:19px;
 font-weight:1000;
 box-shadow:0 8px 25px rgba(255,130,0,.35);
}

.controls{
 margin-top:17px;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.control{
 padding:10px;
 border-radius:12px;
 background:rgba(255,255,255,.07);
 color:#d5e1f2;
 font-size:13px;
}

#gameOver{
 display:none;
}

.finalScore{
 margin-top:14px;
 font-size:22px;
 font-weight:900;
}

#loading{
 position:absolute;
 inset:0;
 z-index:100;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#071326;
 color:#fff;
 font-size:20px;
 font-weight:900;
}
</style>
</head>

<body>

<div id="game">

<div id="loading">Loading 3D World...</div>

<div id="hud">
 <div class="hudLeft">
  <div class="hudBox score">
   SCORE <span id="score">0</span>
  </div>

  <div class="hudBox coins">
   🪙 <span id="coinCount">0</span>
  </div>
 </div>

 <button id="pause">Ⅱ</button>
</div>

<div id="powerBar">

 <div class="power" id="magnetPower">
  🧲 MAGNET <span id="magnetTime"></span>
 </div>

 <div class="power" id="boardPower">
  🛹 SKATEBOARD <span id="boardTime"></span>
 </div>

 <div class="power" id="heliPower">
  🚁 HELICOPTER <span id="heliTime"></span>
 </div>

</div>

<div id="message"></div>

<div id="startScreen" class="overlay">

 <div class="panel">

  <div class="logo">RAIL RUSH</div>

  <div class="subtitle">
   3D railway endless runner.<br>
   Swipe like a mobile runner game.
  </div>

  <button class="startBtn" id="startBtn">
   ▶ START RUN
  </button>

  <div class="controls">

   <div class="control">
    👈👉<br>
    Swipe Left / Right
   </div>

   <div class="control">
    👆<br>
    Swipe Up = Jump
   </div>

   <div class="control">
    👇<br>
    Swipe Down = Slide
   </div>

   <div class="control">
    🪙<br>
    Collect Coins
   </div>

  </div>

 </div>

</div>

<div id="gameOver" class="overlay">

 <div class="panel">

  <div class="logo">GAME OVER</div>

  <div class="finalScore">
   Score: <span id="finalScore">0</span>
  </div>

  <div class="finalScore">
   🪙 Coins: <span id="finalCoins">0</span>
  </div>

  <button class="startBtn" id="restartBtn">
   🔄 RUN AGAIN
  </button>

 </div>

</div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =====================================================
   BASIC SETUP
===================================================== */

const game=document.getElementById("game");

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x70c8ff);

scene.fog=new THREE.Fog(
 0x70c8ff,
 38,
 185
);


const camera=new THREE.PerspectiveCamera(
  67,
  innerWidth/innerHeight,
  .1,
  500
);

camera.position.set(
  0,
  5.8,
  9
);


const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setPixelRatio(
 Math.min(devicePixelRatio,1.7)
);

renderer.setSize(
 innerWidth,
 innerHeight
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=
 THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
 THREE.SRGBColorSpace;

game.appendChild(
 renderer.domElement
);


/* =====================================================
   LIGHT
===================================================== */

const hemi=
 new THREE.HemisphereLight(
  0xffffff,
  0x40516d,
  2.4
);

scene.add(hemi);


const sun=
 new THREE.DirectionalLight(
  0xffffff,
  3
);

sun.position.set(
 -25,
 35,
 15
);

sun.castShadow=true;

sun.shadow.mapSize.width=1024;
sun.shadow.mapSize.height=1024;

scene.add(sun);


/* =====================================================
   MATERIAL
===================================================== */

function mat(color,rough=.7){

 return new THREE.MeshStandardMaterial({
  color:color,
  roughness:rough,
  metalness:.12
 });
}


const railMat=
 mat(0x9aa5b2,.3);

const sleeperMat=
 mat(0x543225);

const groundMat=
 mat(0x4a4650);

const trainBodyMat=
 mat(0x793d61,.42);

const trainRoofMat=
 mat(0x242b42,.4);

const windowMat=
 new THREE.MeshStandardMaterial({
  color:0x9eeeff,
  roughness:.12,
  metalness:.3
 });


/* =====================================================
   WORLD
===================================================== */

const world=
 new THREE.Group();

scene.add(world);


const ground=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   45,
   1,
   520
  ),
  groundMat
 );

ground.position.set(
 0,
 -.55,
 -180
);

ground.receiveShadow=true;

world.add(ground);


/* =====================================================
   TRACKS
===================================================== */

const laneX=[
 -4,
 0,
 4
];


function createTrack(x){

 const group=
  new THREE.Group();


 /* sleepers */

 for(
  let z=5;
  z>-300;
  z-=2.8
 ){

  const sleeper=
   new THREE.Mesh(
    new THREE.BoxGeometry(
     5.7,
     .24,
     .58
    ),
    sleeperMat
   );

  sleeper.position.set(
   x,
   0,
   z
  );

  sleeper.receiveShadow=true;

  group.add(sleeper);
 }


 /* rails */

 [-1.25,1.25].forEach(
  offset=>{

   const rail=
    new THREE.Mesh(
     new THREE.BoxGeometry(
      .18,
      .3,
      620
     ),
     railMat
    );

   rail.position.set(
    x+offset,
    .25,
    -145
   );

   rail.castShadow=true;

   group.add(rail);

  }
 );


 /* center track line */

 const center=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    .08,
    .04,
    620
   ),
   mat(0x25252b)
  );

 center.position.set(
  x,
  .04,
  -145
 );

 group.add(center);


 world.add(group);
}


laneX.forEach(
 createTrack
);


/* =====================================================
   PLATFORM
===================================================== */

function makePlatform(x){

 const platform=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    3,
    1,
    620
   ),
   mat(0x697181)
  );

 platform.position.set(
  x,
  -.03,
  -145
 );

 platform.receiveShadow=true;

 world.add(platform);


 const edge=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    .18,
    .18,
    620
   ),
   mat(0xf4c52d)
  );

 edge.position.set(
  x<0 ? x+1.42 : x-1.42,
  .48,
  -145
 );

 world.add(edge);
}


makePlatform(-7);
makePlatform(7);


/* =====================================================
   BUILDINGS
===================================================== */

const buildingColors=[
 0xb94e3a,
 0x4381a8,
 0xd28e39,
 0x7252a1,
 0x3c946e,
 0xa55d7d
];


function building(
 x,
 z,
 w,
 h,
 d,
 color
){

 const b=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    w,h,d
   ),
   mat(color)
  );

 b.position.set(
  x,
  h/2,
  z
 );

 b.castShadow=true;
 b.receiveShadow=true;

 world.add(b);


 /* windows */

 for(
  let y=2;
  y<h-1;
  y+=2.5
 ){

  for(
   let xx=-w/2+.7;
   xx<w/2-.4;
   xx+=1.5
  ){

   const win=
    new THREE.Mesh(
     new THREE.BoxGeometry(
      .58,
      .75,
      .05
     ),
     new THREE.MeshStandardMaterial({
      color:
       Math.random()>.35
       ?0xffe99c
       :0x6ec5e8,
      emissive:0x453800,
      emissiveIntensity:.28
     })
    );

   win.position.set(
    x+xx,
    y,
    z-d/2-.03
   );

   world.add(win);
  }
 }
}


for(
 let z=0;
 z>-300;
 z-=18
){

 building(
  -11,
  z,
  5,
  9+Math.random()*8,
  13,
  buildingColors[
   Math.floor(
    Math.random()*buildingColors.length
   )
  ]
 );


 building(
  11,
  z-7,
  5,
  10+Math.random()*9,
  13,
  buildingColors[
   Math.floor(
    Math.random()*buildingColors.length
   )
  ]
 );
}


/* =====================================================
   STREET LIGHTS
===================================================== */

function streetLight(x,z){

 const pole=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .07,
    .12,
    4.6,
    8
   ),
   mat(0x202633,.5)
  );

 pole.position.set(
  x,
  2.3,
  z
 );

 world.add(pole);


 const arm=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    1.1,
    .08,
    .08
   ),
   mat(0x202633)
  );

 arm.position.set(
  x+(x<0?.5:-.5),
  4.45,
  z
 );

 world.add(arm);


 const lamp=
  new THREE.Mesh(
   new THREE.SphereGeometry(
    .23,
    12,
    8
   ),
   new THREE.MeshStandardMaterial({
    color:0xffe9a0,
    emissive:0xffa900,
    emissiveIntensity:1.6
   })
  );

 lamp.position.set(
  x+(x<0?1:-1),
  4.42,
  z
 );

 world.add(lamp);
}


for(
 let z=0;
 z>-280;
 z-=18
){

 streetLight(-8,z);
 streetLight(8,z-8);
}


/* =====================================================
   PLAYER
===================================================== */

const player=
 new THREE.Group();

scene.add(player);

player.position.set(
 0,
 0,
 4
);


/* shadow */

const playerShadow=
 new THREE.Mesh(
  new THREE.CircleGeometry(
   .72,
   24
  ),
  new THREE.MeshBasicMaterial({
   color:0x000000,
   transparent:true,
   opacity:.3
  })
 );

playerShadow.rotation.x=-Math.PI/2;
playerShadow.position.y=.03;

scene.add(playerShadow);


/* body */

const body=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   1.05,
   1.35,
   .7
  ),
  mat(0x2476d8)
 );

body.position.y=1.55;
body.castShadow=true;

player.add(body);


/* shirt */

const shirt=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   1.16,
   .72,
   .76
  ),
  mat(0x20b978)
 );

shirt.position.y=1.85;
shirt.castShadow=true;

player.add(shirt);


/* head */

const head=
 new THREE.Mesh(
  new THREE.SphereGeometry(
   .55,
   20,
   16
  ),
  mat(0xf0b184)
 );

head.position.y=2.67;
head.castShadow=true;

player.add(head);


/* hair */

const hair=
 new THREE.Mesh(
  new THREE.SphereGeometry(
   .58,
   20,
   12,
   0,
   Math.PI*2,
   0,
   Math.PI*.48
  ),
  mat(0x17151d)
 );

hair.position.y=2.88;

player.add(hair);


/* legs */

function createLeg(x){

 const g=
  new THREE.Group();

 const leg=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    .38,
    1.1,
    .42
   ),
   mat(0x242b42)
  );

 leg.position.y=.55;
 leg.castShadow=true;

 g.add(leg);

 g.position.x=x;

 player.add(g);

 return g;
}


const legL=createLeg(-.27);
const legR=createLeg(.27);


/* shoes */

function createShoe(x){

 const shoe=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    .52,
    .25,
    .75
   ),
   mat(0x111722)
  );

 shoe.position.set(
  x,
  .04,
  -.12
 );

 shoe.castShadow=true;

 player.add(shoe);

 return shoe;
}


const shoeL=createShoe(-.27);
const shoeR=createShoe(.27);


/* arms */

function createArm(x,side){

 const arm=
  new THREE.Group();

 const mesh=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    .3,
    1.05,
    .32
   ),
   mat(0xf0b184)
  );

 mesh.position.y=-.48;

 arm.add(mesh);

 arm.position.set(
  x,
  1.9,
  0
 );

 arm.rotation.z=
  side<0 ? -.12 : .12;

 player.add(arm);

 return arm;
}


const armL=createArm(-.72,-1);
const armR=createArm(.72,1);


/* =====================================================
   SKATEBOARD
===================================================== */

const skateboard=
 new THREE.Group();

const board=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   1.7,
   .12,
   .42
  ),
  mat(0x713cff,.3)
 );

board.position.y=.2;

skateboard.add(board);


for(
 const x of [-.55,.55]
){

 const wheel=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .11,
    .11,
    .12,
    12
   ),
   mat(0x111111)
  );

 wheel.rotation.z=
  Math.PI/2;

 wheel.position.set(
  x,
  .05,
  0
 );

 skateboard.add(wheel);
}


skateboard.visible=false;

player.add(skateboard);


/* =====================================================
   HELICOPTER
===================================================== */

const helicopter=
 new THREE.Group();


const heliBody=
 new THREE.Mesh(
  new THREE.SphereGeometry(
   .55,
   16,
   12
  ),
  mat(0xff3333)
 );

heliBody.scale.set(
 1.35,.75,1
 );

helicopter.add(heliBody);


const heliWindow=
 new THREE.Mesh(
  new THREE.SphereGeometry(
   .34,
   16,
   10
  ),
  windowMat
 );

heliWindow.position.z=-.42;

helicopter.add(heliWindow);


const heliRotor=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   2.4,
   .07,
   .16
  ),
  mat(0x222222)
 );

heliRotor.position.y=.55;

helicopter.add(heliRotor);

helicopter.position.y=5;

helicopter.visible=false;

player.add(helicopter);


/* =====================================================
   TRAINS
===================================================== */

const trains=[];


function createTrain(
 lane,
 z
){

 const train=
  new THREE.Group();


 const base=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    3.15,
    2.8,
    8
   ),
   trainBodyMat
  );

 base.position.y=1.55;

 base.castShadow=true;
 base.receiveShadow=true;

 train.add(base);


 const roof=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    3.35,
    .35,
    8.2
   ),
   trainRoofMat
  );

 roof.position.y=3.05;

 train.add(roof);


 /* front window */

 const front=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    2.5,
    1.3,
    .15
   ),
   windowMat
  );

 front.position.set(
   0,
   2,
   -4.06
 );

 train.add(front);


 /* side windows */

 for(
  const side of [-1,1]
 ){

  for(
   let zz=-2.6;
   zz<=2.6;
   zz+=1.8
  ){

   const win=
    new THREE.Mesh(
     new THREE.BoxGeometry(
      .06,
      1.15,
      1.2
     ),
     windowMat
    );

   win.position.set(
    side*1.58,
    2.05,
    zz
   );

   train.add(win);
  }
 }


 /* wheels */

 for(
  const x of [-1.15,1.15]
 ){

  for(
   const zz of [-2.7,2.7]
  ){

   const wheel=
    new THREE.Mesh(
     new THREE.CylinderGeometry(
      .38,
      .38,
      .22,
      14
     ),
     mat(0x151515)
    );

   wheel.rotation.z=
    Math.PI/2;

   wheel.position.set(
    x,
    .45,
    zz
   );

   train.add(wheel);
  }
 }


 train.position.set(
  laneX[lane],
  0,
  z
 );

 world.add(train);

 trains.push({
  mesh:train,
  lane:lane
 });
}


/* =====================================================
   BARRIERS
===================================================== */

const obstacles=[];


function createBarrier(
 lane,
 z
){

 const g=
  new THREE.Group();


 const left=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    .28,
    1.5,
    .28
   ),
   mat(0xeeeeee)
  );

 left.position.set(
  -1,
  .75,
  0
 );


 const right=left.clone();

 right.position.x=1;


 g.add(
  left,
  right
 );


 const bar=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    2.35,
    .48,
    .32
   ),
   mat(0xe52e2e)
  );

 bar.position.y=1.35;

 g.add(bar);


 const stripe=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    2.1,
    .12,
    .34
   ),
   mat(0xffffff)
  );

 stripe.position.y=1.35;
 stripe.rotation.z=.15;

 g.add(stripe);


 g.position.set(
  laneX[lane],
  0,
  z
 );

 world.add(g);

 obstacles.push({
  mesh:g,
  lane:lane
 });
}


/* =====================================================
   COINS
===================================================== */

const coinObjects=[];


function createCoin(
 lane,
 z,
 y=1.4
){

 const coin=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .38,
    .38,
    .12,
    24
   ),
   new THREE.MeshStandardMaterial({
    color:0xffc400,
    emissive:0x754500,
    emissiveIntensity:.55,
    metalness:.7,
    roughness:.2
   })
  );


 coin.rotation.z=
  Math.PI/2;


 coin.position.set(
  laneX[lane],
  y,
  z
 );


 world.add(coin);


 coinObjects.push({
  mesh:coin,
  lane:lane,
  collected:false
 });
}


/* =====================================================
   POWERUPS
===================================================== */

const powers=[];


function createPower(
 type,
 lane,
 z
){

 const g=
  new THREE.Group();

 let color=0x00ffff;

 if(type==="magnet")
  color=0xff3366;

 if(type==="board")
  color=0x713cff;

 if(type==="heli")
  color=0x33ff66;


 const body=
  new THREE.Mesh(
   new THREE.OctahedronGeometry(.65),
   new THREE.MeshStandardMaterial({
    color:color,
    emissive:color,
    emissiveIntensity:.4,
    metalness:.35,
    roughness:.2
   })
  );

 g.add(body);


 g.position.set(
  laneX[lane],
  1.5,
  z
 );


 world.add(g);


 powers.push({
  mesh:g,
  type:type,
  lane:lane,
  collected:false
 });
}


/* =====================================================
   GENERATE WORLD OBJECTS
===================================================== */

function generateObjects(){

 for(
  let i=0;
  i<9;
  i++
 ){

  createTrain(
   Math.floor(Math.random()*3),
   -35-i*30-Math.random()*12
  );
 }


 for(
  let i=0;
  i<16;
  i++
 ){

  createBarrier(
   Math.floor(Math.random()*3),
   -23-i*17-Math.random()*10
  );
 }


 for(
  let i=0;
  i<60;
  i++
 ){

  const lane=
   Math.floor(Math.random()*3);

  const z=
   -15-i*6.5;


  createCoin(
   lane,
   z,
   1.35+Math.random()*.35
  );


  if(Math.random()<.22){

   createCoin(
    lane,
    z-2.5,
    2.15
   );
  }
 }


 createPower(
  "magnet",
  0,
  -100
 );

 createPower(
  "board",
  2,
  -165
 );

 createPower(
  "heli",
  1,
  -230
 );
}


generateObjects();


/* =====================================================
   GAME STATE
===================================================== */

let running=false;
let paused=false;
let gameEnded=false;

let score=0;
let coinCount=0;

let speed=.42;

let lane=1;
let targetX=0;

let velocityY=0;

const gravity=-.025;

let jumping=false;
let sliding=false;

let slideTimer=0;

let magnetTimer=0;
let boardTimer=0;
let heliTimer=0;

let distance=0;

let cameraShake=0;


/* =====================================================
   UI
===================================================== */

const scoreEl=
 document.getElementById("score");

const coinEl=
 document.getElementById("coinCount");

const startScreen=
 document.getElementById("startScreen");

 document.getElementById("finalScore");

const finalCoins=
 document.getElementById("finalCoins");

/* =====================================================
   MESSAGE
===================================================== */

let messageTimer=0;


function showMessage(text){

 message.textContent=text;

 message.style.display="block";

 messageTimer=1.1;
}


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function moveLeft(){

 if(!running || paused)
  return;

 lane=
  Math.max(
   0,
   lane-1
  );

 targetX=
  laneX[lane];

 cameraShake=.12;
}


function moveRight(){

 if(!running || paused)
  return;

 lane=
  Math.min(
   2,
   lane+1
  );

 targetX=
  laneX[lane];

 cameraShake=.12;
}


function jump(){

 if(!running || paused)
  return;

 if(jumping)
  return;

 if(sliding){

  sliding=false;
  slideTimer=0;
 }

 jumping=true;

 velocityY=.49;

 cameraShake=.08;
}


function slide(){

 if(!running || paused)
  return;

 if(jumping){

  velocityY=-.42;

  return;
 }

 if(sliding)
  return;

 sliding=true;

 slideTimer=.72;

 cameraShake=.05;
}


/* =====================================================
   REAL MOBILE SWIPE CONTROL
===================================================== */

let touchStartX=0;
let touchStartY=0;

let touchStartTime=0;

let touchActive=false;


renderer.domElement.addEventListener(
 "touchstart",
 e=>{

  if(!running)
   return;

  const t=
   e.changedTouches[0];

  touchStartX=t.clientX;
  touchStartY=t.clientY;

  touchStartTime=
   performance.now();

  touchActive=true;

  e.preventDefault();

 },
 {passive:false}
);


renderer.domElement.addEventListener(
 "touchend",
 e=>{

  if(!touchActive)
   return;

  const t=
   e.changedTouches[0];

  const dx=
   t.clientX-touchStartX;

  const dy=
   t.clientY-touchStartY;

  const duration=
   performance.now()-touchStartTime;

  touchActive=false;

  const ax=
   Math.abs(dx);

  const ay=
   Math.abs(dy);


  /* very small tap */

  if(
   Math.max(ax,ay)<28
  ){

   e.preventDefault();
   return;
  }


  /* swipe */

  if(ax>ay){

   if(dx>0)
    moveRight();
   else
    moveLeft();

  }else{

   if(dy<0)
    jump();
   else
    slide();
  }

  e.preventDefault();

 },
 {passive:false}
);


/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

 if(!running || gameEnded)
  return;

 paused=!paused;

 document.getElementById(
  "pause"
 ).textContent=
  paused ? "▶" : "Ⅱ";
}


document.getElementById(
 "pause"
).addEventListener(
 "click",
 togglePause
);


/* =====================================================
   POWERUP
===================================================== */

function collectPower(p){

 p.collected=true;

 p.mesh.visible=false;


 if(p.type==="magnet"){

  magnetTimer=10;

  showMessage("🧲 MAGNET!");

 }


 if(p.type==="board"){

  boardTimer=12;

  skateboard.visible=true;

  showMessage("🛹 SKATEBOARD!");

 }


 if(p.type==="heli"){

  heliTimer=9;

  helicopter.visible=true;

  showMessage("🚁 HELICOPTER!");

 }
}


/* =====================================================
   COIN
===================================================== */

function collectCoin(c){

 c.collected=true;

 c.mesh.visible=false;

 coinCount++;

 score+=25;

 cameraShake=.05;
}


/* =====================================================
   COLLISION
===================================================== */

function checkCollisions(){

 if(heliTimer>0)
  return;


 for(const t of trains){

  const dz=
   Math.abs(
    t.mesh.position.z-
    player.position.z
   );

  const dx=
   Math.abs(
    t.mesh.position.x-
    player.position.x
   );


  if(
   dz<3.1 &&
   dx<1.55
  ){

   if(
    player.position.y<2.05 &&
    !sliding
   ){

    endGame();

    return;
   }
  }
 }


 for(const o of obstacles){

  const dz=
   Math.abs(
    o.mesh.position.z-
    player.position.z
   );

  const dx=
   Math.abs(
    o.mesh.position.x-
    player.position.x
   );


  if(
   dz<1.7 &&
   dx<1.4
  ){

   if(
    player.position.y<1.3 &&
    !sliding
   ){

    endGame();

    return;
   }
  }
 }
}


/* =====================================================
   COINS UPDATE
===================================================== */

function updateCoins(){

 for(
  const c of coinObjects
 ){

  if(c.collected)
   continue;


  c.mesh.rotation.y+=.09;


  if(magnetTimer>0){

   const dx=
    player.position.x-
    c.mesh.position.x;

   const dy=
    player.position.y+1.3-
    c.mesh.position.y;

   const dz=
    player.position.z-
    c.mesh.position.z;


   const d=
    Math.sqrt(
     dx*dx+
     dy*dy+
     dz*dz
    );


   if(d<9){

    c.mesh.position.x+=
     dx*.13;

    c.mesh.position.y+=
     dy*.13;

    c.mesh.position.z+=
     dz*.13;
   }
  }


  const dx=
   player.position.x-
   c.mesh.position.x;

  const dy=
   player.position.y+1.35-
   c.mesh.position.y;

  const dz=
   player.position.z-
   c.mesh.position.z;


  const d=
   Math.sqrt(
    dx*dx+
    dy*dy+
    dz*dz
   );


  if(d<1.25){

   collectCoin(c);
  }
 }
}


/* =====================================================
   POWER UPDATE
===================================================== */

function updatePowers(){

 for(
  const p of powers
 ){

  if(p.collected)
   continue;


  p.mesh.rotation.y+=.045;

  p.mesh.position.y=
   1.5+
   Math.sin(
    performance.now()*.004
   )*.25;


  const dx=
   player.position.x-
   p.mesh.position.x;

  const dy=
   player.position.y+1.3-
   p.mesh.position.y;

  const dz=
   player.position.z-
   p.mesh.position.z;


  const d=
   Math.sqrt(
    dx*dx+
    dy*dy+
    dz*dz
   );


  if(d<1.5){

   collectPower(p);
  }
 }
}

 for(

/* =====================================================
   PLAYER ANIMATION
===================================================== */

let runTime=0;


function animatePlayer(dt){

 runTime+=
  dt*.018*
  (boardTimer>0?1.25:1);


 /* =================================
    SMOOTH RUN ANIMATION
 ================================= */

 if(!jumping && !sliding){

  const swing=
   Math.sin(runTime)*.7;

  legL.rotation.x=
   swing;

  legR.rotation.x=
   -swing;

  armL.rotation.x=
   -swing*.8;

  armR.rotation.x=
   swing*.8;


  /* running bounce */

  const bounce=
   Math.abs(
    Math.sin(runTime*2)
   )*.055;

  player.position.y=
   bounce;
 }


 /* =================================
    JUMP ANIMATION
 ================================= */

 if(jumping){

  player.position.y+=
   velocityY;

  velocityY+=gravity;


  /* tuck legs */

  legL.rotation.x=-.9;
  legR.rotation.x=-.9;

  armL.rotation.x=.7;
  armR.rotation.x=.7;


  player.rotation.x=
   THREE.MathUtils.lerp(
    player.rotation.x,
    -.12,
    .15
   );


  if(
   player.position.y<=0
  ){

   player.position.y=0;

   velocityY=0;

   jumping=false;

   player.rotation.x=0;
  }
 }


 /* =================================
    SLIDE ANIMATION
 ================================= */

 if(sliding){

  player.scale.y=
   THREE.MathUtils.lerp(
    player.scale.y,
    .58,
    .25
   );

  player.rotation.x=
   THREE.MathUtils.lerp(
    player.rotation.x,
    -.08,
    .2
   );


  legL.rotation.x=0;
  legR.rotation.x=0;

  armL.rotation.x=-.5;
  armR.rotation.x=-.5;

 }else{

  player.scale.y=
   THREE.MathUtils.lerp(
    player.scale.y,
    1,
    .25
   );

  if(!jumping)
   player.rotation.x=
    THREE.MathUtils.lerp(
     player.rotation.x,
     0,
     .2
    );
 }


 /* =================================
    LANE LEAN
 ================================= */

 const laneDifference=
  targetX-player.position.x;

 player.rotation.z=
  THREE.MathUtils.lerp(
   player.rotation.z,
   -laneDifference*.055,
   .18
  );


 /* skateboard */

 skateboard.rotation.z=
  Math.sin(runTime)*.04;


 /* helicopter */

 if(heliTimer>0){

  helicopter.visible=true;

  heliRotor.rotation.y+=.45;

  player.position.y=
   THREE.MathUtils.lerp(
    player.position.y,
    4.7,
    .08
   );

 }else{

  helicopter.visible=false;
 }


 /* player shadow */

 playerShadow.position.x=
  player.position.x;

 playerShadow.position.z=
  player.position.z;

 const shadowScale=
  Math.max(
   .55,
   1-player.position.y*.07
  );

 playerShadow.scale.set(
  shadowScale,
  shadowScale,
  shadowScale
 );
}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

 const desiredX=
  player.position.x*.22;

 camera.position.x+=
  (desiredX-camera.position.x)
  *.09;


 const desiredY=
  heliTimer>0
  ?7
  :5.8;


 camera.position.y+=
  (desiredY-camera.position.y)
  *.07;


 let shakeX=0;
 let shakeY=0;


 if(cameraShake>0){

  shakeX=
   (Math.random()-.5)*
   cameraShake;

  shakeY=
   (Math.random()-.5)*
   cameraShake;

  cameraShake*=.82;
 }


 camera.position.x+=shakeX;
 camera.position.y+=shakeY;


 camera.lookAt(
  player.position.x*.16,
  heliTimer>0 ?3.4:1.75,
  -26
 );
}

   START
===================================================== */

 resetGame();

 running=true;

 startScreen.style.display="none";

 gameOver.style.display="none";

 showMessage("GO!");
}


document.getElementById(
 "startBtn"
).addEventListener(
 "click",
 startGame
);


document.getElementById(
 "restartBtn"
).addEventListener(
 "click",
 startGame
);


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

 if(gameEnded)
  return;

 gameEnded=true;

 running=false;

 finalScore.textContent=
  Math.floor(score);

 finalCoins.textContent=
  coinCount;

 gameOver.style.display="flex";
}


/* =====================================================
   MAIN UPDATE
===================================================== */

let lastTime=
 performance.now();


function update(dt){

 if(!running || paused)
  return;


 /* speed gradually increases */

 speed+=
  dt*.0032;


 /* powers */

 if(magnetTimer>0)
  magnetTimer-=dt/1000;

 if(boardTimer>0)
  boardTimer-=dt/1000;

 if(heliTimer>0)
  heliTimer-=dt/1000;


 if(magnetTimer<0)
  magnetTimer=0;

 if(boardTimer<0)
  boardTimer=0;

 if(heliTimer<0)
  heliTimer=0;


 /* slide */

 if(sliding){

  slideTimer-=dt/1000;

  if(slideTimer<=0){

   slideTimer=0;

   sliding=false;
  }
 }


 /* lane movement */

 player.position.x+=
  (targetX-player.position.x)
  *
  Math.min(
   1,
   dt*.018
  );


 /* world movement */

 const movement=
  speed*
  (dt/16.67);


 for(
  const t of trains
 ){

  t.mesh.position.z+=
   movement;
 }


 for(
  const o of obstacles
 ){

  o.mesh.position.z+=
   movement;
 }


 for(
  const c of coinObjects
 ){

  if(!c.collected)
   c.mesh.position.z+=
    movement;
 }


 for(
  const p of powers
 ){

  if(!p.collected)
   p.mesh.position.z+=
    movement;
 }


 distance+=movement;

 score+=
  movement*.42;


 /* updates */

 animatePlayer(dt);

 updateCoins();

 updatePowers();

 recycleObjects();

 checkCollisions();

 updateCamera();

 updateUI();


 /* message */

 if(messageTimer>0){

  messageTimer-=
   dt/1000;

  if(messageTimer<=0)
   message.style.display="none";
 }
}


/* =====================================================
   RESIZE
===================================================== */

addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );

 }
);


/* =====================================================
   LOOP
===================================================== */

function loop(now){

 const dt=
  Math.min(
   40,
   now-lastTime
  );

 lastTime=now;

 update(dt);

 renderer.render(
  scene,
  camera
 );

 requestAnimationFrame(
  loop
 );
}


/* =====================================================
   LOADING
===================================================== */

document.getElementById(
 "loading"
).style.display="none";


requestAnimationFrame(loop);

</script>
