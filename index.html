<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Neon Rush Runner</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050816;
  font-family:Arial,Segoe UI,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:fixed;
  top:15px;
  left:0;
  width:100%;
  padding:0 15px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  z-index:10;
  pointer-events:none;
}

.hudBox{
  min-width:105px;
  padding:9px 13px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:15px;
  background:rgba(7,12,35,.72);
  backdrop-filter:blur(10px);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.hudLabel{
  color:#8e9abc;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1px;
}

.hudValue{
  margin-top:3px;
  color:#fff;
  font-size:20px;
  font-weight:900;
}

#coinHud .hudValue{
  color:#ffd83d;
}

#startScreen,
#gameOver{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:linear-gradient(
    180deg,
    rgba(2,5,20,.45),
    rgba(2,5,20,.88)
  );
}

.panel{
  width:min(390px,92vw);
  padding:30px 22px;
  text-align:center;
  border-radius:28px;
  border:1px solid rgba(255,255,255,.13);
  background:rgba(8,13,40,.86);
  backdrop-filter:blur(18px);
  box-shadow:0 25px 70px rgba(0,0,0,.55);
}

.logo{
  font-size:38px;
  font-weight:1000;
  font-style:italic;
  letter-spacing:-2px;
  color:#fff;
  text-shadow:
    0 0 12px rgba(0,220,255,.8),
    0 0 35px rgba(90,80,255,.5);
}

.logo span{
  color:#00eaff;
}

.subtitle{
  margin-top:8px;
  color:#9ba8cb;
  font-size:14px;
}

.instructions{
  margin:24px 0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.instruction{
  padding:12px 5px;
  border-radius:14px;
  background:rgba(255,255,255,.06);
  color:#c8d1ed;
  font-size:11px;
}

.instruction b{
  display:block;
  color:#fff;
  font-size:21px;
  margin-bottom:5px;
}

.mainBtn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:16px;
  color:#04101e;
  font-size:16px;
  font-weight:1000;
  background:linear-gradient(135deg,#00eaff,#65ffb1);
  box-shadow:0 8px 30px rgba(0,234,255,.28);
}

.smallText{
  margin-top:13px;
  color:#6f7c9e;
  font-size:11px;
}

#gameOver{
  display:none;
}

.overTitle{
  font-size:35px;
  font-weight:1000;
  color:#fff;
}

.finalScore{
  margin:15px 0;
  font-size:52px;
  font-weight:1000;
  color:#00eaff;
}

.stats{
  display:flex;
  justify-content:center;
  gap:30px;
  margin-bottom:22px;
}

.stat b{
  display:block;
  color:#ffd83d;
  font-size:21px;
}

.stat span{
  color:#7885a7;
  font-size:11px;
}

#touchControls{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:12;
  display:flex;
  gap:10px;
}

.control{
  width:62px;
  height:52px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(7,12,35,.7);
  color:#fff;
  font-size:21px;
  backdrop-filter:blur(8px);
}

.control:active{
  transform:scale(.92);
  background:rgba(0,220,255,.25);
}

#pauseBtn{
  position:fixed;
  top:82px;
  right:15px;
  z-index:11;
  width:40px;
  height:40px;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.13);
  background:rgba(7,12,35,.7);
  color:#fff;
  font-size:17px;
}

#toast{
  position:fixed;
  top:120px;
  left:50%;
  transform:translateX(-50%) translateY(-15px);
  z-index:30;
  padding:10px 17px;
  border-radius:14px;
  background:rgba(5,10,30,.88);
  color:#fff;
  font-weight:bold;
  opacity:0;
  transition:.25s;
  pointer-events:none;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="hudBox">
    <div class="hudLabel">SCORE</div>
    <div class="hudValue" id="score">0</div>
  </div>

  <div class="hudBox" id="coinHud">
    <div class="hudLabel">COINS</div>
    <div class="hudValue">🪙 <span id="coins">0</span></div>
  </div>
</div>

<button id="pauseBtn">Ⅱ</button>

<div id="touchControls">
  <button class="control" id="leftBtn">←</button>
  <button class="control" id="jumpBtn">↑</button>
  <button class="control" id="slideBtn">↓</button>
  <button class="control" id="rightBtn">→</button>
</div>

<div id="toast"></div>

<div id="startScreen">
  <div class="panel">
    <div class="logo">NEON <span>RUSH</span></div>
    <div class="subtitle">Endless Runner</div>

    <div class="instructions">
      <div class="instruction">
        <b>←→</b>
        Move
      </div>
      <div class="instruction">
        <b>↑</b>
        Jump
      </div>
      <div class="instruction">
        <b>↓</b>
        Slide
      </div>
    </div>

    <button class="mainBtn" id="startBtn">START RUN</button>

    <div class="smallText">
      Swipe on the screen or use the buttons
    </div>
  </div>
</div>

<div id="gameOver">
  <div class="panel">
    <div class="overTitle">RUN OVER</div>

    <div class="finalScore" id="finalScore">0</div>

    <div class="stats">
      <div class="stat">
        <b id="finalCoins">0</b>
        <span>COINS</span>
      </div>

      <div class="stat">
        <b id="bestScore">0</b>
        <span>BEST</span>
      </div>
    </div>

    <button class="mainBtn" id="restartBtn">RUN AGAIN</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let dpr = 1;

function resize(){
  W = window.innerWidth;
  H = window.innerHeight;

  dpr = Math.min(window.devicePixelRatio || 1,2);

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  canvas.style.width = W+"px";
  canvas.style.height = H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();

/* ---------------- GAME STATE ---------------- */

let running = false;
let paused = false;
let gameOver = false;

let score = 0;
let coins = 0;
let best = Number(localStorage.getItem("neonRushBest") || 0);

let speed = 0.006;
let distance = 0;

let player = {
  lane:1,
  x:0,
  targetX:0,
  jump:0,
  jumpVelocity:0,
  sliding:false,
  slideTimer:0
};

let objects = [];

let spawnTimer = 0;
let coinTimer = 0;

let lastTime = 0;

/* ---------------- HELPERS ---------------- */

function laneX(lane,z){
  const center = W/2;
  const roadWidth = W * (.18 + z*.48);
  const gap = roadWidth/3;

  return center + (lane-1)*gap;
}

function roadWidth(z){
  return W*(.18 + z*.48);
}

function showToast(text){
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("show");

  setTimeout(()=>{
    t.classList.remove("show");
  },900);
}

/* ---------------- START ---------------- */

function startGame(){
  running = true;
  paused = false;
  gameOver = false;

  score = 0;
  coins = 0;
  speed = 0.006;
  distance = 0;

  objects = [];

  spawnTimer = 0;
  coinTimer = 0;

  player.lane = 1;
  player.x = laneX(1,1);
  player.targetX = player.x;
  player.jump = 0;
  player.jumpVelocity = 0;
  player.sliding = false;
  player.slideTimer = 0;

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("gameOver").style.display="none";

  lastTime = performance.now();
}

function endGame(){
  running = false;
  gameOver = true;

  if(score > best){
    best = Math.floor(score);
    localStorage.setItem("neonRushBest",best);
  }

  document.getElementById("finalScore").textContent = Math.floor(score);
  document.getElementById("finalCoins").textContent = coins;
  document.getElementById("bestScore").textContent = best;

  document.getElementById("gameOver").style.display="flex";
}

/* ---------------- CONTROLS ---------------- */

function moveLeft(){
  if(!running || paused) return;

  if(player.lane > 0){
    player.lane--;
    player.targetX = laneX(player.lane,1);
  }
}

function moveRight(){
  if(!running || paused) return;

  if(player.lane < 2){
    player.lane++;
    player.targetX = laneX(player.lane,1);
  }
}

function jump(){
  if(!running || paused) return;

  if(player.jump <= 0 && !player.sliding){
    player.jumpVelocity = .020;
  }
}

function slide(){
  if(!running || paused) return;

  if(player.jump <= 0){
    player.sliding = true;
    player.slideTimer = .55;
  }
}

document.getElementById("leftBtn").onclick=moveLeft;
document.getElementById("rightBtn").onclick=moveRight;
document.getElementById("jumpBtn").onclick=jump;
document.getElementById("slideBtn").onclick=slide;

document.getElementById("startBtn").onclick=startGame;
document.getElementById("restartBtn").onclick=startGame;

document.getElementById("pauseBtn").onclick=()=>{
  if(!running) return;

  paused=!paused;

  document.getElementById("pauseBtn").textContent =
    paused ? "▶" : "Ⅱ";
};

/* ---------------- KEYBOARD ---------------- */

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft" || e.key==="a") moveLeft();
  if(e.key==="ArrowRight" || e.key==="d") moveRight();
  if(e.key==="ArrowUp" || e.key==="w" || e.key===" ") jump();
  if(e.key==="ArrowDown" || e.key==="s") slide();

  if(e.key==="p"){
    document.getElementById("pauseBtn").click();
  }
});

/* ---------------- SWIPE ---------------- */

let touchStartX=0;
let touchStartY=0;

canvas.addEventListener("touchstart",e=>{
  const t=e.touches[0];

  touchStartX=t.clientX;
  touchStartY=t.clientY;
},{passive:true});

canvas.addEventListener("touchend",e=>{
  const t=e.changedTouches[0];

  const dx=t.clientX-touchStartX;
  const dy=t.clientY-touchStartY;

  const ax=Math.abs(dx);
  const ay=Math.abs(dy);

  if(Math.max(ax,ay)<30) return;

  if(ax>ay){
    if(dx>0) moveRight();
    else moveLeft();
  }else{
    if(dy<0) jump();
    else slide();
  }
},{passive:true});

/* ---------------- OBJECT SPAWN ---------------- */

function spawnObstacle(){
  const lane=Math.floor(Math.random()*3);

  const type=Math.random();

  objects.push({
    kind:"obstacle",
    lane,
    z:0,
    type:type<.72 ? "block":"barrier"
  });
}

function spawnCoin(){
  const lane=Math.floor(Math.random()*3);

  objects.push({
    kind:"coin",
    lane,
    z:0,
    spin:Math.random()*Math.PI*2
  });
}

function spawnPattern(){
  const r=Math.random();

  if(r<.25){
    /* three coins */
    const lane=Math.floor(Math.random()*3);

    for(let i=0;i<3;i++){
      objects.push({
        kind:"coin",
        lane,
        z:-i*.055,
        spin:i
      });
    }

  }else if(r<.48){
    /* two coins */
    const lane=Math.floor(Math.random()*3);

    for(let i=0;i<4;i++){
      objects.push({
        kind:"coin",
        lane,
        z:-i*.055,
        spin:i
      });
    }

  }else{
    spawnObstacle();
  }
}

/* ---------------- UPDATE ---------------- */

function update(dt){

  if(!running || paused) return;

  distance += speed*dt*60;

  score += speed*dt*600;

  speed += dt*.0000025;

  if(speed>.015) speed=.015;

  /* player movement */
  player.x +=
    (player.targetX-player.x) *
    Math.min(1,dt*14);

  /* jump physics */
  if(player.jump>0 || player.jumpVelocity>0){

    player.jump += player.jumpVelocity*dt*60;

    player.jumpVelocity -= .00125*dt*60;

    if(player.jump<=0){
      player.jump=0;
      player.jumpVelocity=0;
    }
  }

  /* slide */
  if(player.sliding){

    player.slideTimer-=dt;

    if(player.slideTimer<=0){
      player.sliding=false;
    }
  }

  /* spawn */
  spawnTimer -= dt;

  if(spawnTimer<=0){

    spawnPattern();

    spawnTimer =
      Math.max(.45, .9-speed*30) +
      Math.random()*.35;
  }

  /* extra coins */
  coinTimer -= dt;

  if(coinTimer<=0){

    if(Math.random()<.72){
      spawnCoin();
    }

    coinTimer=.38+Math.random()*.35;
  }

  /* objects */
  for(let i=objects.length-1;i>=0;i--){

    const o=objects[i];

    o.z += speed*dt*60;

    if(o.kind==="coin"){
      o.spin += dt*7;
    }

    /* collision zone */
    if(o.z>.86 && o.z<1.03){

      if(o.lane===player.lane){

        if(o.kind==="coin"){

          coins++;
          score+=35;

          objects.splice(i,1);

          continue;
        }

        if(o.kind==="obstacle"){

          const jumping =
            player.jump > .18;

          const sliding =
            player.sliding;

          /*
           block:
           jump over it

           barrier:
           slide under it
          */

          if(o.type==="block" && jumping){
            objects.splice(i,1);
            continue;
          }

          if(o.type==="barrier" && sliding){
            objects.splice(i,1);
            continue;
          }

          endGame();
          return;
        }
      }
    }

    if(o.z>1.2){
      objects.splice(i,1);
    }
  }

  document.getElementById("score").textContent =
    Math.floor(score);

  document.getElementById("coins").textContent =
    coins;
}

/* ---------------- DRAW BACKGROUND ---------------- */

function drawBackground(){

  /* sky */
  const sky=ctx.createLinearGradient(0,0,0,H);

  sky.addColorStop(0,"#050820");
  sky.addColorStop(.5,"#101b49");
  sky.addColorStop(1,"#071026");

  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  /* moon */
  ctx.beginPath();
  ctx.arc(W*.78,H*.16,32,0,Math.PI*2);
  ctx.fillStyle="rgba(160,220,255,.15)";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(W*.78,H*.16,20,0,Math.PI*2);
  ctx.fillStyle="rgba(210,245,255,.18)";
  ctx.fill();

  /* distant city */
  const ground=H*.42;

  for(let i=0;i<24;i++){

    const bw=18+((i*37)%40);
    const bh=25+((i*73)%100);
    const x=i*(W/22)-20;

    ctx.fillStyle=
      i%3===0
      ? "rgba(30,49,94,.8)"
      : "rgba(17,31,65,.9)";

    ctx.fillRect(x,ground-bh,bw,bh);

    for(let y=ground-bh+10;y<ground-5;y+=13){

      if((i+y)%3<1){

        ctx.fillStyle="rgba(0,220,255,.3)";
        ctx.fillRect(x+5,y,4,4);
      }
    }
  }

  /* horizon glow */
  const glow=ctx.createLinearGradient(0,ground-30,0,ground+80);

  glow.addColorStop(0,"rgba(0,220,255,.16)");
  glow.addColorStop(1,"rgba(0,0,0,0)");

  ctx.fillStyle=glow;
  ctx.fillRect(0,ground-30,W,100);
}

/* ---------------- DRAW ROAD ---------------- */

function drawRoad(){

  const horizon=H*.43;
  const bottom=H*1.08;

  /* road */
  ctx.beginPath();

  ctx.moveTo(W/2-W*.09,horizon);
  ctx.lineTo(W/2+W*.09,horizon);
  ctx.lineTo(W/2+W*.60,bottom);
  ctx.lineTo(W/2-W*.60,bottom);
  ctx.closePath();

  const roadGrad=ctx.createLinearGradient(0,horizon,0,H);

  roadGrad.addColorStop(0,"#111936");
  roadGrad.addColorStop(1,"#070b18");

  ctx.fillStyle=roadGrad;
  ctx.fill();

  /* side glow */
  ctx.strokeStyle="rgba(0,234,255,.6)";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(W/2-W*.09,horizon);
  ctx.lineTo(W/2-W*.60,bottom);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(W/2+W*.09,horizon);
  ctx.lineTo(W/2+W*.60,bottom);
  ctx.stroke();

  /* lane markings */

  for(let lane=1;lane<3;lane++){

    for(let i=0;i<16;i++){

      let z=(i/16 + distance*.002)%1;

      const y=horizon+(z*z)*(bottom-horizon);
      const rw=roadWidth(z);

      const x=W/2 + (lane-1.5)*(rw/3);

      const nextZ=z+.035;

      const nextY=horizon+
        (nextZ*nextZ)*(bottom-horizon);

      ctx.strokeStyle="rgba(110,150,220,.35)";
      ctx.lineWidth=1+z*3;

      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(
        W/2+(lane-1.5)*(roadWidth(nextZ)/3),
        nextY
      );
      ctx.stroke();
    }
  }

  /* road strips */

  for(let i=0;i<14;i++){

    let z=(i/14+distance*.004)%1;

    const y=horizon+(z*z)*(bottom-horizon);
    const size=2+z*8;

    ctx.fillStyle="rgba(0,234,255,.12)";

    ctx.fillRect(
      W/2-size/2,
      y,
      size,
      2+z*5
    );
  }
}

/* ---------------- OBJECT DRAW ---------------- */

function drawCoin(o){

  const z=o.z;

  if(z<0) return;

  const horizon=H*.43;
  const bottom=H*1.03;

  const y=horizon+(z*z)*(bottom-horizon);
  const x=laneX(o.lane,z);

  const size=7+z*27;

  ctx.save();

  ctx.translate(x,y);

  const squash=
    Math.abs(Math.cos(o.spin))*.7+.3;

  ctx.scale(squash,1);

  ctx.beginPath();
  ctx.arc(0,-size*.7,size,0,Math.PI*2);

  ctx.fillStyle="#ffd83d";
  ctx.shadowColor="#ffd83d";
  ctx.shadowBlur=18;

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff2a0";
  ctx.lineWidth=Math.max(1,z*3);
  ctx.stroke();

  ctx.fillStyle="#9b6900";
  ctx.font=`bold ${Math.max(7,size*.75)}px Arial`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText("$",0,-size*.7);

  ctx.restore();
}

function drawObstacle(o){

  const z=o.z;

  if(z<0) return;

  const horizon=H*.43;
  const bottom=H*1.03;

  const y=horizon+(z*z)*(bottom-horizon);
  const x=laneX(o.lane,z);

  const size=10+z*58;

  ctx.save();
  ctx.translate(x,y);

  if(o.type==="block"){

    const w=size*1.2;
    const h=size*1.25;

    ctx.fillStyle="#ff3d63";
    ctx.shadowColor="#ff2855";
    ctx.shadowBlur=18;

    ctx.fillRect(
      -w/2,
      -h,
      w,
      h
    );

    ctx.shadowBlur=0;

    ctx.fillStyle="#ff91a8";
    ctx.fillRect(
      -w*.35,
      -h*.82,
      w*.7,
      h*.12
    );

    ctx.fillStyle="#651329";
    ctx.font=`bold ${Math.max(8,size*.28)}px Arial`;
    ctx.textAlign="center";
    ctx.fillText("DANGER",0,-h*.45);

  }else{

    /* overhead barrier */
    const w=size*1.45;
    const h=size*.72;

    ctx.fillStyle="#ffb52e";
    ctx.shadowColor="#ff9d00";
    ctx.shadowBlur=15;

    ctx.fillRect(
      -w/2,
      -h,
      w,
      h*.35
    );

    ctx.fillRect(
      -w/2,
      -h,
      w*.14,
      h
    );

    ctx.fillRect(
      w*.36,
      -h,
      w*.14,
      h
    );

    ctx.shadowBlur=0;

    ctx.strokeStyle="#4d2a00";
    ctx.lineWidth=Math.max(2,z*4);

    ctx.beginPath();
    ctx.moveTo(-w*.42,-h*.91);
    ctx.lineTo(w*.42,-h*.64);
    ctx.stroke();
  }

  ctx.restore();
}

/* ---------------- PLAYER ---------------- */

function drawPlayer(){

  const groundY=H*.82;

  const jumpHeight=
    Math.min(180,player.jump*H*1.5);

  const x=player.x;
  const y=groundY-jumpHeight;

  const scale=
    Math.max(.75,Math.min(1.15, H/800));

  ctx.save();

  ctx.translate(x,y);

  /* shadow */
  if(player.jump<.05){

    ctx.beginPath();
    ctx.ellipse(
      0,
      10,
      25*scale,
      8*scale,
      0,
      0,
      Math.PI*2
    );

    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.fill();
  }

  if(player.sliding){

    /* body sliding */
    ctx.rotate(-.05);

    ctx.fillStyle="#00eaff";
    ctx.shadowColor="#00eaff";
    ctx.shadowBlur=18;

    ctx.fillRect(
      -26*scale,
      -23*scale,
      52*scale,
      18*scale
    );

    ctx.shadowBlur=0;

    /* head */
    ctx.beginPath();
    ctx.arc(
      22*scale,
      -25*scale,
      12*scale,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#ffd0a8";
    ctx.fill();

    /* legs */
    ctx.strokeStyle="#ff4fd8";
    ctx.lineWidth=8*scale;
    ctx.lineCap="round";

    ctx.beginPath();
    ctx.moveTo(-15*scale,-7*scale);
    ctx.lineTo(-34*scale,7*scale);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(3*scale,-7*scale);
    ctx.lineTo(24*scale,8*scale);
    ctx.stroke();

  }else{

    /* legs */
    ctx.strokeStyle="#ff4fd8";
    ctx.lineWidth=9*scale;
    ctx.lineCap="round";

    ctx.beginPath();
    ctx.moveTo(-9*scale,20*scale);
    ctx.lineTo(-17*scale,45*scale);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(9*scale,20*scale);
    ctx.lineTo(17*scale,45*scale);
    ctx.stroke();

    /* shoes */
    ctx.strokeStyle="#fff";
    ctx.lineWidth=6*scale;

    ctx.beginPath();
    ctx.moveTo(-17*scale,45*scale);
    ctx.lineTo(-25*scale,45*scale);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(17*scale,45*scale);
    ctx.lineTo(25*scale,45*scale);
    ctx.stroke();

    /* body */
    ctx.fillStyle="#00eaff";
    ctx.shadowColor="#00eaff";
    ctx.shadowBlur=18;

    ctx.fillRect(
      -17*scale,
      -10*scale,
      34*scale,
      34*scale
    );

    ctx.shadowBlur=0;

    /* jacket */
    ctx.fillStyle="#273bff";
    ctx.fillRect(
      -15*scale,
      -7*scale,
      30*scale,
      25*scale
    );

    /* arms */
    ctx.strokeStyle="#ffd0a8";
    ctx.lineWidth=8*scale;

    ctx.beginPath();
    ctx.moveTo(-15*scale,0);
    ctx.lineTo(-30*scale,18*scale);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(15*scale,0);
    ctx.lineTo(30*scale,18*scale);
    ctx.stroke();

    /* head */
    ctx.beginPath();
    ctx.arc(
      0,
      -25*scale,
      14*scale,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#ffd0a8";
    ctx.fill();

    /* hair */
    ctx.beginPath();
    ctx.arc(
      0,
      -30*scale,
      14*scale,
      Math.PI,
      Math.PI*2
    );

    ctx.fillStyle="#111";
    ctx.fill();

    /* eyes */
    ctx.fillStyle="#111";

    ctx.beginPath();
    ctx.arc(-5*scale,-26*scale,2*scale,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(5*scale,-26*scale,2*scale,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

/* ---------------- DRAW ---------------- */

function draw(){

  ctx.clearRect(0,0,W,H);

  drawBackground();
  drawRoad();

  /* sort by depth */
  objects
    .slice()
    .sort((a,b)=>a.z-b.z)
    .forEach(o=>{
      if(o.kind==="coin") drawCoin(o);
      else drawObstacle(o);
    });

  drawPlayer();

  if(paused && running){

    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle="#fff";
    ctx.font="900 38px Arial";
    ctx.textAlign="center";
    ctx.fillText("PAUSED",W/2,H/2);
  }
}

/* ---------------- LOOP ---------------- */

function loop(time){

  const dt=Math.min(.033,(time-lastTime)/1000 || 0);

  lastTime=time;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* initial player */
player.x=laneX(1,1);
player.targetX=player.x;

/* prevent browser gestures */
document.addEventListener("touchmove",e=>{
  if(running) e.preventDefault();
},{passive:false});

</script>

</body>
</html>
