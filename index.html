<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Neon Rush - Train Runner</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#061027;
  font-family:Arial,Segoe UI,sans-serif;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#hud{
  position:fixed;
  top:14px;
  left:12px;
  right:12px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.box{
  min-width:105px;
  padding:9px 13px;
  border-radius:15px;
  background:rgba(4,10,32,.76);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(10px);
}

.label{
  color:#8290b4;
  font-size:9px;
  font-weight:bold;
  letter-spacing:1px;
}

.value{
  color:#fff;
  font-size:20px;
  font-weight:900;
  margin-top:2px;
}

#coinValue{
  color:#ffd83d;
}

#powerHud{
  position:fixed;
  top:72px;
  left:50%;
  transform:translateX(-50%);
  z-index:11;
  padding:7px 13px;
  border-radius:20px;
  background:rgba(3,9,28,.8);
  border:1px solid rgba(0,234,255,.3);
  color:#fff;
  font-size:12px;
  font-weight:bold;
  opacity:0;
  transition:.2s;
}

#powerHud.show{
  opacity:1;
}

#controls{
  position:fixed;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  z-index:12;
  display:flex;
  gap:9px;
}

.ctrl{
  width:58px;
  height:52px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:16px;
  background:rgba(4,10,32,.72);
  color:#fff;
  font-size:21px;
  font-weight:bold;
  backdrop-filter:blur(8px);
}

.ctrl:active{
  transform:scale(.9);
  background:rgba(0,220,255,.25);
}

#pause{
  position:fixed;
  right:13px;
  top:116px;
  width:42px;
  height:42px;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(4,10,32,.72);
  color:#fff;
  z-index:12;
}

.screen{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(2,5,20,.74);
}

.panel{
  width:min(400px,92vw);
  padding:29px 21px;
  border-radius:28px;
  background:rgba(7,14,43,.94);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 25px 80px rgba(0,0,0,.6);
  text-align:center;
}

.logo{
  color:#fff;
  font-size:38px;
  font-weight:1000;
  font-style:italic;
  letter-spacing:-2px;
  text-shadow:0 0 20px rgba(0,230,255,.7);
}

.logo span{
  color:#00eaff;
}

.sub{
  margin-top:6px;
  color:#93a0c3;
  font-size:13px;
}

.features{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin:22px 0;
}

.feature{
  padding:11px 7px;
  border-radius:13px;
  background:rgba(255,255,255,.055);
  color:#b9c5e5;
  font-size:11px;
}

.feature b{
  display:block;
  color:#fff;
  font-size:19px;
  margin-bottom:3px;
}

.start{
  width:100%;
  border:0;
  border-radius:16px;
  padding:15px;
  background:linear-gradient(135deg,#00eaff,#6cffb0);
  color:#04101b;
  font-weight:1000;
  font-size:16px;
  box-shadow:0 8px 30px rgba(0,220,255,.25);
}

.hint{
  margin-top:12px;
  color:#6e7c9e;
  font-size:10px;
}

#gameOver{
  display:none;
}

.over{
  color:#fff;
  font-size:34px;
  font-weight:1000;
}

.final{
  margin:12px 0 20px;
  color:#00eaff;
  font-size:50px;
  font-weight:1000;
}

.stats{
  display:flex;
  justify-content:center;
  gap:35px;
  margin-bottom:22px;
}

.stats b{
  display:block;
  color:#ffd83d;
  font-size:21px;
}

.stats span{
  color:#7180a3;
  font-size:10px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="box">
    <div class="label">DISTANCE / SCORE</div>
    <div class="value" id="score">0</div>
  </div>

  <div class="box">
    <div class="label">COINS</div>
    <div class="value" id="coinValue">🪙 0</div>
  </div>
</div>

<div id="powerHud"></div>

<button id="pause">Ⅱ</button>

<div id="controls">
  <button class="ctrl" id="left">←</button>
  <button class="ctrl" id="jump">↑</button>
  <button class="ctrl" id="slide">↓</button>
  <button class="ctrl" id="right">→</button>
</div>

<div id="startScreen" class="screen">
  <div class="panel">
    <div class="logo">NEON <span>RUSH</span></div>
    <div class="sub">Ultimate Train Runner</div>

    <div class="features">
      <div class="feature"><b>🚆</b>Trains</div>
      <div class="feature"><b>🧲</b>Coin Magnet</div>
      <div class="feature"><b>🚁</b>Helicopter</div>
      <div class="feature"><b>🛹</b>Skateboard</div>
    </div>

    <button class="start" id="start">START RUN</button>

    <div class="hint">
      Swipe ← → to change lane • ↑ Jump • ↓ Slide
    </div>
  </div>
</div>

<div id="gameOver" class="screen">
  <div class="panel">
    <div class="over">RUN OVER</div>
    <div class="final" id="finalScore">0</div>

    <div class="stats">
      <div>
        <b id="finalCoins">0</b>
        <span>COINS</span>
      </div>

      <div>
        <b id="best">0</b>
        <span>BEST</span>
      </div>
    </div>

    <button class="start" id="restart">RUN AGAIN</button>
  </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=Math.min(devicePixelRatio||1,2);

function resize(){
  W=innerWidth;
  H=innerHeight;

  DPR=Math.min(devicePixelRatio||1,2);

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();

/* =========================
   GAME STATE
========================= */

let playing=false;
let paused=false;

let score=0;
let coins=0;
let best=Number(localStorage.getItem("neonRushBest")||0);

let speed=.0058;
let world=0;

let objects=[];
let particles=[];

let spawnTimer=0;
let coinTimer=0;
let powerTimer=0;

let last=performance.now();

const player={
  lane:1,
  x:0,
  targetX:0,

  jump:0,
  jumpVelocity:0,

  sliding:false,
  slideTimer:0,

  skateboard:false,
  skateboardTimer:0,

  magnet:false,
  magnetTimer:0,

  helicopter:false,
  helicopterTimer:0
};

/* =========================
   ROAD
========================= */

function horizon(){
  return H*.40;
}

function roadBottom(){
  return H*1.08;
}

function roadWidth(z){
  return W*(.18+z*.48);
}

function laneX(lane,z=1){
  const rw=roadWidth(z);
  return W/2+(lane-1)*(rw/3);
}

function depthY(z){
  return horizon()+z*z*(roadBottom()-horizon());
}

/* =========================
   GAME START
========================= */

function startGame(){

  playing=true;
  paused=false;

  score=0;
  coins=0;

  speed=.0058;
  world=0;

  objects=[];
  particles=[];

  spawnTimer=.3;
  coinTimer=.2;
  powerTimer=4;

  player.lane=1;
  player.x=laneX(1);
  player.targetX=player.x;

  player.jump=0;
  player.jumpVelocity=0;

  player.sliding=false;
  player.slideTimer=0;

  player.skateboard=false;
  player.skateboardTimer=0;

  player.magnet=false;
  player.magnetTimer=0;

  player.helicopter=false;
  player.helicopterTimer=0;

  document.getElementById("startScreen").style.display="none";
  document.getElementById("gameOver").style.display="none";

  last=performance.now();
}

/* =========================
   GAME OVER
========================= */

function endGame(){

  playing=false;

  best=Math.max(best,Math.floor(score));

  localStorage.setItem(
    "neonRushBest",
    best
  );

  document.getElementById("finalScore").textContent=
    Math.floor(score);

  document.getElementById("finalCoins").textContent=
    coins;

  document.getElementById("best").textContent=
    best;

  document.getElementById("gameOver").style.display="flex";
}

/* =========================
   CONTROLS
========================= */

function left(){

  if(!playing||paused)return;

  if(player.lane>0){
    player.lane--;
    player.targetX=laneX(player.lane);
  }
}

function right(){

  if(!playing||paused)return;

  if(player.lane<2){
    player.lane++;
    player.targetX=laneX(player.lane);
  }
}

function jump(){

  if(!playing||paused)return;

  if(player.jump<=0){

    player.jumpVelocity=.0195;

    if(player.skateboard){
      player.jumpVelocity=.022;
    }
  }
}

function slide(){

  if(!playing||paused)return;

  if(player.jump<=0){

    player.sliding=true;
    player.slideTimer=.65;
  }
}

document.getElementById("left").onclick=left;
document.getElementById("right").onclick=right;
document.getElementById("jump").onclick=jump;
document.getElementById("slide").onclick=slide;

document.getElementById("start").onclick=startGame;
document.getElementById("restart").onclick=startGame;

document.getElementById("pause").onclick=()=>{

  if(!playing)return;

  paused=!paused;

  document.getElementById("pause").textContent=
    paused?"▶":"Ⅱ";
};

document.addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft"||e.key==="a")left();
  if(e.key==="ArrowRight"||e.key==="d")right();
  if(e.key==="ArrowUp"||e.key==="w"||e.key===" ")jump();
  if(e.key==="ArrowDown"||e.key==="s")slide();

  if(e.key==="p"){
    document.getElementById("pause").click();
  }
});

/* =========================
   SWIPE
========================= */

let sx=0;
let sy=0;

canvas.addEventListener("touchstart",e=>{

  sx=e.touches[0].clientX;
  sy=e.touches[0].clientY;

},{passive:true});

canvas.addEventListener("touchend",e=>{

  const x=e.changedTouches[0].clientX;
  const y=e.changedTouches[0].clientY;

  const dx=x-sx;
  const dy=y-sy;

  if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;

  if(Math.abs(dx)>Math.abs(dy)){

    if(dx>0)right();
    else left();

  }else{

    if(dy<0)jump();
    else slide();
  }

},{passive:true});

/* =========================
   SPAWN
========================= */

function addTrain(lane){

  objects.push({
    type:"train",
    lane:lane,
    z:0,
    trainType:Math.random()<.55?"long":"engine",
    hit:true
  });
}

function addBarrier(lane){

  objects.push({
    type:"barrier",
    lane:lane,
    z:0
  });
}

function addCoin(lane,z=0){

  objects.push({
    type:"coin",
    lane:lane,
    z:z,
    spin:Math.random()*6
  });
}

function addMagnet(lane){

  objects.push({
    type:"magnet",
    lane:lane,
    z:0
  });
}

function addSkateboard(lane){

  objects.push({
    type:"skateboard",
    lane:lane,
    z:0
  });
}

function addHelicopter(lane){

  objects.push({
    type:"helicopter",
    lane:lane,
    z:0
  });
}

/* =========================
   PATTERNS
========================= */

function spawnPattern(){

  const r=Math.random();

  if(r<.22){

    /* train in one lane + coins */

    const lane=Math.floor(Math.random()*3);

    addTrain(lane);

    for(let i=0;i<5;i++){
      addCoin(
        (lane+1)%3,
        -.15-i*.06
      );
    }

  }else if(r<.40){

    /* two trains, one safe lane */

    const safe=Math.floor(Math.random()*3);

    for(let l=0;l<3;l++){

      if(l!==safe){
        addTrain(l);
      }
    }

    for(let i=0;i<4;i++){
      addCoin(safe,-i*.06);
    }

  }else if(r<.54){

    /* three trains staggered */

    addTrain(0);

    objects.push({
      type:"train",
      lane:1,
      z:-.18
    });

    objects.push({
      type:"train",
      lane:2,
      z:-.36
    });

  }else if(r<.67){

    /* jump barrier + coins */

    const lane=Math.floor(Math.random()*3);

    addBarrier(lane);

    for(let i=0;i<5;i++){
      addCoin(lane,-i*.055);
    }

  }else{

    const lane=Math.floor(Math.random()*3);

    addTrain(lane);
  }
}

/* =========================
   POWER UPS
========================= */

function spawnPower(){

  const lane=Math.floor(Math.random()*3);

  const r=Math.random();

  if(r<.35){
    addMagnet(lane);
  }else if(r<.68){
    addSkateboard(lane);
  }else{
    addHelicopter(lane);
  }
}

/* =========================
   PARTICLES
========================= */

function particle(x,y){

  particles.push({
    x:x,
    y:y,
    vx:(Math.random()-.5)*2,
    vy:-Math.random()*2,
    life:1
  });
}

function updateParticles(dt){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx*dt*60;
    p.y+=p.vy*dt*60;

    p.vy+=.05*dt*60;

    p.life-=dt*1.8;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }
}

function drawParticles(){

  particles.forEach(p=>{

    ctx.globalAlpha=p.life;

    ctx.beginPath();
    ctx.arc(p.x,p.y,2.5,0,Math.PI*2);

    ctx.fillStyle="#00eaff";
    ctx.fill();

  });

  ctx.globalAlpha=1;
}

/* =========================
   POWER UI
========================= */

function updatePowerUI(){

  const hud=document.getElementById("powerHud");

  let text="";

  if(player.magnet){
    text+="🧲 MAGNET "+Math.ceil(player.magnetTimer)+"s  ";
  }

  if(player.helicopter){
    text+="🚁 FLIGHT "+Math.ceil(player.helicopterTimer)+"s  ";
  }

  if(player.skateboard){
    text+="🛹 SKATEBOARD "+Math.ceil(player.skateboardTimer)+"s";
  }

  if(text){

    hud.textContent=text;
    hud.classList.add("show");

  }else{

    hud.classList.remove("show");
  }
}

/* =========================
   UPDATE
========================= */

function update(dt){

  if(!playing||paused)return;

  world+=speed*dt*60;

  score+=speed*dt*850;

  /* gradually increase speed */

  speed+=dt*.0000022;

  if(speed>.0145){
    speed=.0145;
  }

  /* lane movement */

  player.x+=(player.targetX-player.x)*
    Math.min(1,dt*13);

  /* jump */

  if(player.jump>0||player.jumpVelocity>0){

    player.jump+=player.jumpVelocity*dt*60;

    player.jumpVelocity-=.00118*dt*60;

    if(player.jump<=0){

      player.jump=0;
      player.jumpVelocity=0;
    }
  }

  /* slide */

  if(player.sliding){

    player.slideTimer-=dt;

    if(player.slideTimer<=0){
      player.sliding=false;
    }
  }

  /* skateboard */

  if(player.skateboard){

    player.skateboardTimer-=dt;

    if(player.skateboardTimer<=0){
      player.skateboard=false;
    }
  }

  /* magnet */

  if(player.magnet){

    player.magnetTimer-=dt;

    if(player.magnetTimer<=0){
      player.magnet=false;
    }
  }

  /* helicopter */

  if(player.helicopter){

    player.helicopterTimer-=dt;

    if(player.helicopterTimer<=0){

      player.helicopter=false;

      showMessage("HELICOPTER FINISHED");
    }
  }

  /* obstacle spawn */

  spawnTimer-=dt;

  if(spawnTimer<=0){

    spawnPattern();

    spawnTimer=
      Math.max(.46,.88-speed*25)+
      Math.random()*.35;
  }

  /* coins */

  coinTimer-=dt;

  if(coinTimer<=0){

    if(Math.random()<.8){

      const lane=Math.floor(Math.random()*3);

      for(let i=0;i<3;i++){
        addCoin(lane,-i*.065);
      }
    }

    coinTimer=.45+Math.random()*.35;
  }

  /* powerups */

  powerTimer-=dt;

  if(powerTimer<=0){

    spawnPower();

    powerTimer=
      6+
      Math.random()*7;
  }

  /* objects */

  for(let i=objects.length-1;i>=0;i--){

    const o=objects[i];

    o.z+=speed*dt*60;

    if(o.spin!==undefined){
      o.spin+=dt*7;
    }

    /*
      Magnet effect:
      coins from nearby lanes
      fly toward player
    */

    if(
      o.type==="coin" &&
      player.magnet &&
      o.z>.55
    ){

      const px=player.x;
      const ox=laneX(o.lane,o.z);

      if(Math.abs(ox-px)<W*.30){

        o.lane=player.lane;
      }
    }

    /* collision */

    if(o.z>.82&&o.z<1.05){

      if(o.lane===player.lane){

        /* coin */

        if(o.type==="coin"){

          coins++;
          score+=40;

          particle(
            player.x,
            H*.65
          );

          objects.splice(i,1);

          continue;
        }

        /* magnet */

        if(o.type==="magnet"){

          player.magnet=true;
          player.magnetTimer=9;

          showMessage("🧲 MAGNET ACTIVE");

          objects.splice(i,1);

          continue;
        }

        /* skateboard */

        if(o.type==="skateboard"){

          player.skateboard=true;
          player.skateboardTimer=12;

          showMessage("🛹 SKATEBOARD ACTIVE");

          objects.splice(i,1);

          continue;
        }

        /* helicopter */

        if(o.type==="helicopter"){

          player.helicopter=true;
          player.helicopterTimer=8;

          showMessage("🚁 FLY MODE ACTIVE");

          objects.splice(i,1);

          continue;
        }

        /* train */

        if(o.type==="train"){

          /*
             Helicopter flies above trains.
             Jump can land on trains.
             Skateboard gives extra jump.
          */

          if(player.helicopter){

            objects.splice(i,1);
            continue;
          }

          if(player.jump>.15){

            objects.splice(i,1);
            continue;
          }

          endGame();
          return;
        }

        /* barrier */

        if(o.type==="barrier"){

          if(player.jump>.12){

            objects.splice(i,1);
            continue;
          }

          if(player.sliding){

            objects.splice(i,1);
            continue;
          }

          endGame();
          return;
        }
      }
    }

    if(o.z>1.2){

      objects.splice(i,1);
    }
  }

  updateParticles(dt);
  updatePowerUI();

  document.getElementById("score").textContent=
    Math.floor(score);

  document.getElementById("coinValue").textContent=
    "🪙 "+coins;
}

/* =========================
   MESSAGE
========================= */

let messageTimer=null;

function showMessage(text){

  const hud=document.getElementById("powerHud");

  hud.textContent=text;
  hud.classList.add("show");

  clearTimeout(messageTimer);

  messageTimer=setTimeout(()=>{
    updatePowerUI();
  },1300);
}

/* =========================
   BACKGROUND
========================= */

function drawBackground(){

  const sky=ctx.createLinearGradient(
    0,0,0,H
  );

  sky.addColorStop(0,"#05091e");
  sky.addColorStop(.45,"#16295b");
  sky.addColorStop(1,"#081225");

  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  /* moon */

  ctx.beginPath();
  ctx.arc(
    W*.78,
    H*.14,
    30,
    0,
    Math.PI*2
  );

  ctx.fillStyle="rgba(190,230,255,.18)";
  ctx.fill();

  /* city */

  const base=H*.41;

  for(let i=0;i<28;i++){

    const bw=18+(i*17)%35;
    const bh=35+(i*47)%110;
    const x=i*(W/25)-20;

    ctx.fillStyle=
      i%2
      ?"rgba(10,23,53,.95)"
      :"rgba(18,34,72,.9)";

    ctx.fillRect(
      x,
      base-bh,
      bw,
      bh
    );

    for(
      let y=base-bh+10;
      y<base-5;
      y+=15
    ){

      if((i+Math.floor(y))%3===0){

        ctx.fillStyle="rgba(255,205,70,.4)";

        ctx.fillRect(
          x+5,
          y,
          4,
          5
        );
      }
    }
  }

  /* distant rails/buildings */

  ctx.fillStyle="rgba(0,220,255,.12)";
  ctx.fillRect(
    0,
    base,
    W,
    3
  );
}

/* =========================
   ROAD
========================= */

function drawRoad(){

  const h=horizon();
  const b=roadBottom();

  /* main road */

  ctx.beginPath();

  ctx.moveTo(
    W/2-W*.09,
    h
  );

  ctx.lineTo(
    W/2+W*.09,
    h
  );

  ctx.lineTo(
    W/2+W*.62,
    b
  );

  ctx.lineTo(
    W/2-W*.62,
    b
  );

  ctx.closePath();

  const rg=ctx.createLinearGradient(
    0,h,
    0,b
  );

  rg.addColorStop(0,"#16213e");
  rg.addColorStop(1,"#070b17");

  ctx.fillStyle=rg;
  ctx.fill();

  /* side rails */

  ctx.strokeStyle="rgba(0,234,255,.65)";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(W/2-W*.09,h);
  ctx.lineTo(W/2-W*.62,b);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(W/2+W*.09,h);
  ctx.lineTo(W/2+W*.62,b);
  ctx.stroke();

  /* tracks */

  for(let l=0;l<4;l++){

    const offset=(l-1.5)/3;

    ctx.strokeStyle="rgba(125,145,190,.27)";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
      W/2+offset*roadWidth(0),
      h
    );

    ctx.lineTo(
      W/2+offset*roadWidth(1),
      b
    );

    ctx.stroke();
  }

  /* sleepers */

  for(let i=0;i<18;i++){

    const z=
      (i/18+world*.008)%1;

    const y=depthY(z);
    const rw=roadWidth(z);

    ctx.fillStyle="rgba(120,140,180,.28)";

    ctx.fillRect(
      W/2-rw*.48,
      y,
      rw*.96,
      2+z*5
    );
  }

  /* lane dividers */

  for(let l=1;l<3;l++){

    for(let i=0;i<15;i++){

      const z=
        (i/15+world*.006)%1;

      const y=depthY(z);
      const x=
        W/2+(l-1.5)*roadWidth(z)/3;

      ctx.fillStyle="rgba(80,170,220,.3)";

      ctx.fillRect(
        x,
        y,
        2+z*2,
        3+z*8
      );
    }
  }
}

/* =========================
   TRAIN
========================= */

function drawTrain(o){

  if(o.z<0)return;

  const z=o.z;
  const x=laneX(o.lane,z);
  const y=depthY(z);

  const scale=.15+z*1.05;

  const w=52*scale;
  const h=115*scale;

  ctx.save();
  ctx.translate(x,y);

  /* train shadow */

  ctx.fillStyle="rgba(0,0,0,.35)";

  ctx.fillRect(
    -w*.65,
    4,
    w*1.3,
    10*scale
  );

  /* body */

  ctx.fillStyle="#b9c6d7";

  ctx.fillRect(
    -w/2,
    -h,
    w,
    h
  );

  /* front */

  ctx.fillStyle="#283b59";

  ctx.fillRect(
    -w*.43,
    -h*.88,
    w*.86,
    h*.38
  );

  /* windshield */

  ctx.fillStyle="#071528";

  ctx.fillRect(
    -w*.32,
    -h*.82,
    w*.64,
    h*.18
  );

  /* red lights */

  ctx.fillStyle="#ff304f";

  ctx.beginPath();
  ctx.arc(
    -w*.25,
    -h*.28,
    Math.max(2,4*scale),
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.beginPath();
  ctx.arc(
    w*.25,
    -h*.28,
    Math.max(2,4*scale),
    0,
    Math.PI*2
  );
  ctx.fill();

  /* train stripes */

  ctx.fillStyle="#00b9d8";

  ctx.fillRect(
    -w/2,
    -h*.43,
    w,
    h*.09
  );

  /* wheels */

  ctx.fillStyle="#101522";

  ctx.beginPath();
  ctx.arc(
    -w*.3,
    2,
    7*scale,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.beginPath();
  ctx.arc(
    w*.3,
    2,
    7*scale,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.restore();
}

/* =========================
   BARRIER
========================= */

function drawBarrier(o){

  if(o.z<0)return;

  const z=o.z;
  const x=laneX(o.lane,z);
  const y=depthY(z);

  const s=.2+z;

  const w=70*s;
  const h=30*s;

  ctx.save();
  ctx.translate(x,y);

  ctx.fillStyle="#ffb52e";

  ctx.fillRect(
    -w/2,
    -h,
    w,
    h*.35
  );

  ctx.fillRect(
    -w/2,
    -h,
    w*.12,
    h
  );

  ctx.fillRect(
    w*.38,
    -h,
    w*.12,
    h
  );

  ctx.fillStyle="#5a3000";
  ctx.font=`bold ${Math.max(7,10*s)}px Arial`;
  ctx.textAlign="center";
  ctx.fillText(
    "SLIDE",
    0,
    -h*.48
  );

  ctx.restore();
}

/* =========================
   COIN
========================= */

function drawCoin(o){

  if(o.z<0)return;

  const z=o.z;

  let x=laneX(o.lane,z);
  let y=depthY(z)-18-z*30;

  /* magnet pull visual */

  if(player.magnet && z>.45){

    const px=player.x;
    const py=H*.67;

    x+=(px-x)*.045;
    y+=(py-y)*.045;
  }

  const s=5+z*22;

  ctx.save();

  ctx.translate(x,y);

  const squash=
    .35+
    Math.abs(Math.cos(o.spin))*.65;

  ctx.scale(squash,1);

  ctx.beginPath();
  ctx.arc(
    0,
    0,
    s,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#ffd83d";
  ctx.shadowColor="#ffd83d";
  ctx.shadowBlur=18;

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff4a6";
  ctx.lineWidth=2;

  ctx.stroke();

  ctx.fillStyle="#a86f00";
  ctx.font=`bold ${Math.max(7,s*.75)}px Arial`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    "C",
    0,
    1
  );

  ctx.restore();
}

/* =========================
   MAGNET
========================= */

function drawMagnet(o){

  if(o.z<0)return;

  const z=o.z;
  const x=laneX(o.lane,z);
  const y=depthY(z)-20;

  const s=.25+z;

  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(-.15);

  ctx.strokeStyle="#ff405f";
  ctx.lineWidth=10*s;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.arc(
    0,
    0,
    15*s,
    0,
    Math.PI
  );

  ctx.stroke();

  ctx.strokeStyle="#fff";
  ctx.lineWidth=4*s;

  ctx.beginPath();
  ctx.moveTo(-15*s,0);
  ctx.lineTo(-15*s,-6*s);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(15*s,0);
  ctx.lineTo(15*s,-6*s);
  ctx.stroke();

  ctx.restore();
}

/* =========================
   SKATEBOARD
========================= */

function drawSkateboard(o){

  if(o.z<0)return;

  const z=o.z;
  const x=laneX(o.lane,z);
  const y=depthY(z)-10;

  const s=.25+z;

  ctx.save();
  ctx.translate(x,y);

  ctx.fillStyle="#ff4fd8";

  ctx.beginPath();

  ctx.roundRect(
    -25*s,
    -5*s,
    50*s,
    8*s,
    5*s
  );

  ctx.fill();

  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(
    -16*s,
    5*s,
    5*s,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.beginPath();
  ctx.arc(
    16*s,
    5*s,
    5*s,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.restore();
}

/* =========================
   HELICOPTER
========================= */

function drawHelicopter(o){

  if(o.z<0)return;

  const z=o.z;
  const x=laneX(o.lane,z);
  const y=depthY(z)-65-z*25;

  const s=.2+z*.8;

  ctx.save();
  ctx.translate(x,y);

  /* rotor */

  ctx.strokeStyle="#d7faff";
  ctx.lineWidth=Math.max(2,3*s);

  ctx.beginPath();
  ctx.moveTo(-35*s,0);
  ctx.lineTo(35*s,0);
  ctx.stroke();

  /* body */

  ctx.fillStyle="#29c8ff";

  ctx.beginPath();
  ctx.ellipse(
    0,
    8*s,
    24*s,
    13*s,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* glass */

  ctx.fillStyle="#102b55";

  ctx.beginPath();
  ctx.ellipse(
    7*s,
    4*s,
    11*s,
    7*s,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* tail */

  ctx.strokeStyle="#29c8ff";
  ctx.lineWidth=6*s;

  ctx.beginPath();
  ctx.moveTo(-20*s,8*s);
  ctx.lineTo(-42*s,0);
  ctx.stroke();

  /* light */

  ctx.fillStyle="#ffd83d";

  ctx.beginPath();
  ctx.arc(
    0,
    20*s,
    3*s,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}

/* =========================
   PLAYER
========================= */

function drawPlayer(){

  let baseY=H*.79;

  /*
     Helicopter makes player fly
  */

  if(player.helicopter){

    baseY=H*.39+
      Math.sin(performance.now()/150)*8;
  }

  const jumpHeight=
    Math.min(
      H*.27,
      player.jump*H*1.7
    );

  const x=player.x;
  const y=baseY-jumpHeight;

  const s=Math.max(.72,Math.min(1.1,H/800));

  ctx.save();
  ctx.translate(x,y);

  /*
     helicopter propeller
  */

  if(player.helicopter){

    ctx.strokeStyle="#e9ffff";
    ctx.lineWidth=3*s;

    ctx.beginPath();
    ctx.moveTo(-40*s,-62*s);
    ctx.lineTo(40*s,-62*s);
    ctx.stroke();

    ctx.fillStyle="#29c8ff";

    ctx.beginPath();
    ctx.ellipse(
      0,
      -50*s,
      26*s,
      15*s,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#0a284d";

    ctx.beginPath();
    ctx.ellipse(
      8*s,
      -53*s,
      11*s,
      7*s,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  /*
     shadow
  */

  if(!player.helicopter){

    ctx.fillStyle="rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
      0,
      12,
      25*s,
      7*s,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  /*
     skateboard
  */

  if(player.skateboard){

    ctx.fillStyle="#ff4fd8";

    ctx.beginPath();

    ctx.roundRect(
      -28*s,
      45*s,
      56*s,
      7*s,
      5*s
    );

    ctx.fill();

    ctx.fillStyle="#111";

    ctx.beginPath();
    ctx.arc(
      -18*s,
      54*s,
      5*s,
      0,
      Math.PI*2
    );
    ctx.fill();

    ctx.beginPath();
    ctx.arc(
      18*s,
      54*s,
      5*s,
      0,
      Math.PI*2
    );
    ctx.fill();
  }

  /* slide */

  if(player.sliding){

    ctx.fillStyle="#273bff";

    ctx.fillRect(
      -25*s,
      -17*s,
      50*s,
      19*s
    );

    ctx.fillStyle="#ffd0a8";

    ctx.beginPath();

    ctx.arc(
      23*s,
      -22*s,
      12*s,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#ff4fd8";
    ctx.lineWidth=8*s;
    ctx.lineCap="round";

    ctx.beginPath();
    ctx.moveTo(-13*s,-2*s);
    ctx.lineTo(-32*s,15*s);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(5*s,-2*s);
    ctx.lineTo(27*s,13*s);
    ctx.stroke();

  }else{

    /* legs */

    ctx.strokeStyle="#ff4fd8";
    ctx.lineWidth=9*s;
    ctx.lineCap="round";

    /*
       running animation
    */

    const run=Math.sin(
      performance.now()/85
    )*13;

    ctx.beginPath();

    ctx.moveTo(
      -8*s,
      20*s
    );

    ctx.lineTo(
      (-15+run)*s,
      44*s
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
      8*s,
      20*s
    );

    ctx.lineTo(
      (15-run)*s,
      44*s
    );

    ctx.stroke();

    /* shoes */

    ctx.strokeStyle="#fff";
    ctx.lineWidth=6*s;

    ctx.beginPath();
    ctx.moveTo(
      (-15+run)*s,
      44*s
    );
    ctx.lineTo(
      (-25+run)*s,
      44*s
    );
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(
      (15-run)*s,
      44*s
    );
    ctx.lineTo(
      (25-run)*s,
      44*s
    );
    ctx.stroke();

    /* body */

    ctx.fillStyle="#273bff";
    ctx.shadowColor="#00eaff";
    ctx.shadowBlur=16;

    ctx.fillRect(
      -17*s,
      -11*s,
      34*s,
      34*s
    );

    ctx.shadowBlur=0;

    /* arms */

    const arm=
      Math.sin(performance.now()/85)*10;

    ctx.strokeStyle="#ffd0a8";
    ctx.lineWidth=8*s;

    ctx.beginPath();

    ctx.moveTo(
      -15*s,
      -1*s
    );

    ctx.lineTo(
      (-28-arm)*s,
      17*s
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
      15*s,
      -1*s
    );

    ctx.lineTo(
      (28+arm)*s,
      17*s
    );

    ctx.stroke();

    /* head */

    ctx.beginPath();

    ctx.arc(
      0,
      -27*s,
      14*s,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#ffd0a8";
    ctx.fill();

    /* hair */

    ctx.beginPath();

    ctx.arc(
      0,
      -32*s,
      14*s,
      Math.PI,
      Math.PI*2
    );

    ctx.fillStyle="#111827";
    ctx.fill();

    /* eyes */

    ctx.fillStyle="#111";

    ctx.beginPath();
    ctx.arc(
      -5*s,
      -28*s,
      2*s,
      0,
      Math.PI*2
    );
    ctx.fill();

    ctx.beginPath();
    ctx.arc(
      5*s,
      -28*s,
      2*s,
      0,
      Math.PI*2
    );
    ctx.fill();
  }

  ctx.restore();
}

/* =========================
   OBJECTS
========================= */

function drawObjects(){

  const sorted=
    objects
    .slice()
    .sort((a,b)=>a.z-b.z);

  sorted.forEach(o=>{

    if(o.type==="train")
      drawTrain(o);

    else if(o.type==="barrier")
      drawBarrier(o);

    else if(o.type==="coin")
      drawCoin(o);

    else if(o.type==="magnet")
      drawMagnet(o);

    else if(o.type==="skateboard")
      drawSkateboard(o);

    else if(o.type==="helicopter")
      drawHelicopter(o);
  });
}

/* =========================
   DRAW
========================= */

function draw(){

  ctx.clearRect(0,0,W,H);

  drawBackground();
  drawRoad();
  drawObjects();
  drawPlayer();
  drawParticles();

  if(paused&&playing){

    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle="#fff";
    ctx.font="900 38px Arial";
    ctx.textAlign="center";

    ctx.fillText(
      "PAUSED",
      W/2,
      H/2
    );
  }
}

/* =========================
   LOOP
========================= */

function loop(t){

  const dt=
    Math.min(
      .033,
      (t-last)/1000||0
    );

  last=t;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* initial player */

player.x=laneX(1);
player.targetX=player.x;

/* prevent scrolling while playing */

document.addEventListener(
  "touchmove",
  e=>{
    if(playing)e.preventDefault();
  },
  {passive:false}
);
</script>

</body>
</html>
