<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Rail Runner 3D</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#72c9ff;
  touch-action:none;
  font-family:Arial,Helvetica,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#hud{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  z-index:20;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.hudLeft{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.hudBox{
  min-width:180px;
  padding:8px 14px;
  border-radius:15px;
  color:white;
  background:rgba(7,28,55,.84);
  border:2px solid rgba(255,255,255,.22);
  box-shadow:0 6px 20px rgba(0,0,0,.28);
  font-weight:900;
  backdrop-filter:blur(8px);
}

.score{
  font-size:20px;
}

.coins{
  color:#ffd629;
  font-size:18px;
}

#pause{
  width:54px;
  height:54px;
  border:0;
  border-radius:17px;
  background:rgba(255,255,255,.93);
  color:#172943;
  font-size:22px;
  font-weight:900;
  pointer-events:auto;
  box-shadow:0 7px 22px rgba(0,0,0,.2);
}

#powerBar{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:25;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:center;
  width:95%;
  pointer-events:none;
}

.power{
  display:none;
  padding:8px 12px;
  border-radius:20px;
  background:rgba(5,20,43,.9);
  border:2px solid rgba(255,255,255,.2);
  color:white;
  font-size:12px;
  font-weight:900;
}

#message{
  position:absolute;
  left:50%;
  top:44%;
  transform:translate(-50%,-50%);
  z-index:30;
  display:none;
  color:white;
  font-size:40px;
  font-weight:1000;
  text-shadow:0 5px 18px #000;
  pointer-events:none;
}

.overlay{
  position:absolute;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at 50% 15%,rgba(30,150,255,.35),transparent 40%),
    linear-gradient(180deg,#092b52,#050d1b);
}

.panel{
  width:min(92%,420px);
  padding:28px 22px;
  border-radius:27px;
  background:rgba(5,22,45,.95);
  border:2px solid rgba(255,255,255,.15);
  box-shadow:0 25px 80px rgba(0,0,0,.55);
  color:white;
}

.logo{
  font-size:39px;
  font-weight:1000;
  color:#ffd52a;
  text-shadow:0 4px 0 #d56b00,0 9px 18px rgba(0,0,0,.5);
}

.subtitle{
  margin-top:12px;
  color:#cbd9ea;
  font-size:14px;
  line-height:1.5;
}

.startBtn{
  width:100%;
  height:57px;
  margin-top:22px;
  border:0;
  border-radius:17px;
  background:linear-gradient(135deg,#ffd82b,#ff7200);
  color:#291800;
  font-size:19px;
  font-weight:1000;
}

.controls{
  margin-top:16px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.control{
  padding:11px 5px;
  border-radius:13px;
  background:rgba(255,255,255,.07);
  color:#dbe7f6;
  font-size:12px;
  line-height:1.4;
}

.finalScore{
  margin-top:12px;
  font-size:21px;
  font-weight:900;
}

#gameOver{
  display:none;
}

#loading{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#071426;
  color:white;
  font-size:19px;
  font-weight:900;
}
</style>
</head>

<body>

<div id="game">

<div id="loading">Loading 3D Railway...</div>

<div id="hud">

  <div class="hudLeft">

    <div class="hudBox score">
      SCORE <span id="score">0</span>
    </div>

    <div class="hudBox coins">
      🪙 <span id="coinCount">0</span>
    </div>

  </div>

  <button id="pause">Ⅱ</button>

</div>

<div id="powerBar">

  <div class="power" id="magnetPower">
    🧲 MAGNET <span id="magnetTime"></span>
  </div>

  <div class="power" id="sneakerPower">
    👟 SNEAKERS <span id="sneakerTime"></span>
  </div>

  <div class="power" id="boardPower">
    🛹 BOARD <span id="boardTime"></span>
  </div>

  <div class="power" id="jetPower">
    🚀 JETPACK <span id="jetTime"></span>
  </div>

</div>

<div id="message"></div>

<div id="startScreen" class="overlay">

  <div class="panel">

    <div class="logo">RAIL RUNNER</div>

    <div class="subtitle">
      Run through the 3D railway city.<br>
      Dodge trains, jump and roll through obstacles.
    </div>

    <button class="startBtn" id="startBtn">
      ▶ START RUN
    </button>

    <div class="controls">

      <div class="control">
        👈 👉<br>
        SWIPE LEFT / RIGHT
      </div>

      <div class="control">
        👆<br>
        SWIPE UP = JUMP
      </div>

      <div class="control">
        👇<br>
        SWIPE DOWN = ROLL
      </div>

      <div class="control">
        🪙<br>
        COLLECT COINS
      </div>

    </div>

  </div>

</div>

<div id="gameOver" class="overlay">

  <div class="panel">

    <div class="logo">GAME OVER</div>

    <div class="finalScore">
      SCORE: <span id="finalScore">0</span>
    </div>

    <div class="finalScore">
      🪙 COINS: <span id="finalCoins">0</span>
    </div>

    <button class="startBtn" id="restartBtn">
      🔄 RUN AGAIN
    </button>

  </div>

</div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =========================================================
   BASIC
========================================================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x70c9ff);

scene.fog=new THREE.Fog(
  0x70c9ff,
  35,
  145
);


const camera=new THREE.PerspectiveCamera(
  62,
  innerWidth/innerHeight,
  .1,
  500
);

camera.position.set(
  0,
  5.4,
  10
);


const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.5)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=
  THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
  THREE.SRGBColorSpace;

document.getElementById("game")
  .appendChild(renderer.domElement);


/* =========================================================
   LIGHT
========================================================= */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x567044,
    2.2
  )
);

const sun=new THREE.DirectionalLight(
  0xffffff,
  3
);

sun.position.set(
  -25,
  35,
  20
);

sun.castShadow=true;

sun.shadow.mapSize.width=1024;
sun.shadow.mapSize.height=1024;

sun.shadow.camera.left=-40;
sun.shadow.camera.right=40;
sun.shadow.camera.top=50;
sun.shadow.camera.bottom=-50;

scene.add(sun);


/* =========================================================
   MATERIALS
========================================================= */

function mat(color,rough=.75,metal=.05){

  return new THREE.MeshStandardMaterial({
    color,
    roughness:rough,
    metalness:metal
  });

}

const grassMat=mat(0x55a947);
const dirtMat=mat(0x7c583e);
const sleeperMat=mat(0x59392b);
const railMat=mat(0xc6d0d8,.32,.65);
const darkMat=mat(0x202630);
const blackMat=mat(0x101319,.4,.65);
const windowMat=new THREE.MeshStandardMaterial({
  color:0x9eeaff,
  roughness:.3,
  metalness:.1
});

const yellowWindowMat=new THREE.MeshStandardMaterial({
  color:0xffe58b,
  emissive:0x654b00,
  emissiveIntensity:.35,
  roughness:.4
});


/* =========================================================
   WORLD
========================================================= */

const world=new THREE.Group();

scene.add(world);


/* =========================================================
   TRACK
========================================================= */

const LANES=[
  -2.5,
  0,
  2.5
];

const trackParts=[];


/* Long visual track sections */

for(let section=0;section<12;section++){

  const g=new THREE.Group();

  const centerZ=
    20-section*42;

  const ground=new THREE.Mesh(
    new THREE.BoxGeometry(
      14,
      .16,
      42
    ),
    grassMat
  );

  ground.position.y=-.32;

  g.add(ground);


  const dirt=new THREE.Mesh(
    new THREE.BoxGeometry(
      11,
      .12,
      42
    ),
    dirtMat
  );

  dirt.position.y=-.22;

  g.add(dirt);


  /* Rails */

  LANES.forEach(x=>{

    [-1.02,1.02].forEach(offset=>{

      const rail=new THREE.Mesh(
        new THREE.BoxGeometry(
          .13,
          .25,
          42
        ),
        railMat
      );

      rail.position.set(
        x+offset,
        .06,
        0
      );

      rail.castShadow=true;

      g.add(rail);

    });


    /* sleepers */

    for(let z=-20;z<=20;z+=2.4){

      const sleeper=new THREE.Mesh(
        new THREE.BoxGeometry(
          4.25,
          .18,
          .46
        ),
        sleeperMat
      );

      sleeper.position.set(
        x,
        -.06,
        z
      );

      g.add(sleeper);

    }

  });


  g.position.z=centerZ;

  world.add(g);

  trackParts.push(g);

}


/* =========================================================
   CITY BUILDINGS
========================================================= */

const buildingColors=[
  0xef5948,
  0x388fd0,
  0xf2b92f,
  0x8150a7,
  0x39a06b,
  0xd9688e
];

const cityParts=[];


function createBuilding(
  x,
  z,
  width,
  height,
  depth,
  color
){

  const g=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(
      width,
      height,
      depth
    ),
    mat(color)
  );

  body.position.y=height/2;

  body.castShadow=true;

  g.add(body);


  const roof=new THREE.Mesh(
    new THREE.BoxGeometry(
      width+.12,
      .25,
      depth+.12
    ),
    darkMat
  );

  roof.position.y=height+.12;

  g.add(roof);


  for(
    let y=2;
    y<height-1;
    y+=2.5
  ){

    for(
      let xx=-width/2+.65;
      xx<width/2-.3;
      xx+=1.15
    ){

      const win=new THREE.Mesh(
        new THREE.BoxGeometry(
          .42,
          .62,
          .045
        ),
        yellowWindowMat
      );

      win.position.set(
        xx,
        y,
        depth/2+.025
      );

      g.add(win);

    }

  }

  g.position.set(x,0,z);

  return g;

}


for(let i=0;i<32;i++){

  const z=
    15-i*18;

  const left=createBuilding(
    -8-Math.random()*2,
    z,
    4.5,
    7+Math.random()*10,
    9,
    buildingColors[
      Math.floor(
        Math.random()*buildingColors.length
      )
    ]
  );

  const right=createBuilding(
    8+Math.random()*2,
    z-8,
    4.5,
    7+Math.random()*11,
    9,
    buildingColors[
      Math.floor(
        Math.random()*buildingColors.length
      )
    ]
  );

  world.add(left);
  world.add(right);

  cityParts.push(left,right);

}


/* =========================================================
   STREET LIGHTS
========================================================= */

for(let i=0;i<40;i++){

  const z=5-i*16;

  [-5.4,5.4].forEach(x=>{

    const pole=new THREE.Mesh(
      new THREE.CylinderGeometry(
        .055,.075,2.4,7
      ),
      darkMat
    );

    pole.position.set(
      x,
      1.15,
      z
    );

    world.add(pole);


    const lamp=new THREE.Mesh(
      new THREE.SphereGeometry(
        .13,
        8,
        8
      ),
      yellowWindowMat
    );

    lamp.position.set(
      x,
      2.35,
      z
    );

    world.add(lamp);

  });

}


/* =========================================================
   PLAYER
========================================================= */

const player=new THREE.Group();

scene.add(player);

player.position.set(
  0,
  0,
  6
);


/* Body */

const torso=new THREE.Mesh(
  new THREE.BoxGeometry(
    .72,
    .9,
    .48
  ),
  mat(0x147fd0)
);

torso.position.y=1.55;
torso.castShadow=true;

player.add(torso);


/* Shirt front */

const shirtFront=new THREE.Mesh(
  new THREE.BoxGeometry(
    .5,
    .55,
    .04
  ),
  mat(0x18a8ed)
);

shirtFront.position.set(
  0,
  1.58,
  -.255
);

player.add(shirtFront);


/* Neck */

const neck=new THREE.Mesh(
  new THREE.CylinderGeometry(
    .14,.15,.24,10
  ),
  mat(0xe5a477)
);

neck.position.y=2.08;

player.add(neck);


/* Head */

const head=new THREE.Mesh(
  new THREE.SphereGeometry(
    .43,
    18,
    14
  ),
  mat(0xe7a579)
);

head.position.y=2.48;
head.castShadow=true;

player.add(head);


/* Hair */

const hair=new THREE.Mesh(
  new THREE.SphereGeometry(
    .44,
    16,
    10
  ),
  mat(0x201916)
);

hair.scale.y=.6;

hair.position.set(
  0,
  2.68,
  .01
);

player.add(hair);


/* Cap */

const cap=new THREE.Mesh(
  new THREE.SphereGeometry(
    .47,
    16,
    10
  ),
  mat(0x1766df)
);

cap.scale.y=.38;

cap.position.set(
  0,
  2.82,
  -.01
);

player.add(cap);


/* Cap visor */

const visor=new THREE.Mesh(
  new THREE.BoxGeometry(
    .55,
    .075,
    .3
  ),
  mat(0x0c3e9d)
);

visor.position.set(
  0,
  2.77,
  -.3
);

visor.rotation.x=-.12;

player.add(visor);


/* =========================================================
   LEGS - REAL RUNNING JOINTS
========================================================= */

function makeLeg(x){

  const leg=new THREE.Group();

  const thigh=new THREE.Mesh(
    new THREE.BoxGeometry(
      .25,.55,.27
    ),
    mat(0x2254a5)
  );

  thigh.position.y=-.28;

  thigh.castShadow=true;

  leg.add(thigh);


  const shin=new THREE.Mesh(
    new THREE.BoxGeometry(
      .23,.52,.25
    ),
    mat(0x173f82)
  );

  shin.position.y=-.78;

  shin.castShadow=true;

  leg.add(shin);


  leg.position.set(
    x,
    1.1,
    0
  );

  return leg;

}

const legL=makeLeg(-.21);
const legR=makeLeg(.21);

player.add(legL,legR);


/* Shoes */

function makeShoe(){

  const shoe=new THREE.Mesh(
    new THREE.BoxGeometry(
      .34,
      .18,
      .58
    ),
    mat(0xf5f5f5,.45,.05)
  );

  shoe.position.set(
    0,
    -.99,
    -.12
  );

  shoe.castShadow=true;

  return shoe;

}

const shoeL=makeShoe();
const shoeR=makeShoe();

legL.add(shoeL);
legR.add(shoeR);


/* =========================================================
   ARMS
========================================================= */

function makeArm(x){

  const upper=new THREE.Group();

  const sleeve=new THREE.Mesh(
    new THREE.BoxGeometry(
      .27,
      .48,
      .27
    ),
    mat(0x147fd0)
  );

  sleeve.position.y=-.23;

  upper.add(sleeve);


  const forearm=new THREE.Mesh(
    new THREE.BoxGeometry(
      .23,
      .48,
      .23
    ),
    mat(0xe29b72)
  );

  forearm.position.y=-.66;

  upper.add(forearm);


  const hand=new THREE.Mesh(
    new THREE.SphereGeometry(
      .14,
      10,
      8
    ),
    mat(0xe7a579)
  );

  hand.position.y=-.91;

  upper.add(hand);


  upper.position.set(
    x,
    1.88,
    0
  );

  return upper;

}

const armL=makeArm(-.55);
const armR=makeArm(.55);

player.add(armL,armR);


/* =========================================================
   HOVERBOARD
========================================================= */

const hoverboard=new THREE.Group();

const boardBody=new THREE.Mesh(
  new THREE.BoxGeometry(
    1.35,
    .12,
    .4
  ),
  mat(0x713cff,.3,.5)
);

boardBody.position.y=.1;

hoverboard.add(boardBody);

for(const x of [-.45,.45]){

  const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .085,.085,.14,10
    ),
    blackMat
  );

  wheel.rotation.z=Math.PI/2;

  wheel.position.set(
    x,
    -.02,
    0
  );

  hoverboard.add(wheel);

}

hoverboard.visible=false;

player.add(hoverboard);


/* =========================================================
   JETPACK
========================================================= */

const jetpack=new THREE.Group();

const pack=new THREE.Mesh(
  new THREE.BoxGeometry(
    .58,
    .72,
    .32
  ),
  mat(0x444b58,.35,.55)
);

pack.position.set(
  0,
  1.48,
  .38
);

jetpack.add(pack);


for(const x of [-.19,.19]){

  const nozzle=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .08,.11,.25,8
    ),
    blackMat
  );

  nozzle.position.set(
    x,
    1.08,
    .39
  );

  jetpack.add(nozzle);


  const flame=new THREE.Mesh(
    new THREE.ConeGeometry(
      .11,
      .45,
      8
    ),
    new THREE.MeshStandardMaterial({
      color:0xff6800,
      emissive:0xff2600,
      emissiveIntensity:1
    })
  );

  flame.rotation.x=Math.PI;

  flame.position.set(
    x,
    .77,
    .39
  );

  jetpack.add(flame);

}

jetpack.visible=false;

player.add(jetpack);


/* =========================================================
   TRAINS
========================================================= */

const trains=[];

const trainColors=[
  0xd93636,
  0x2478d1,
  0xf0b91e,
  0x25a65a,
  0xb64ac5
];


function createTrain(lane,z,color){

  const g=new THREE.Group();


  /* Under carriage */

  const under=new THREE.Mesh(
    new THREE.BoxGeometry(
      2.45,
      .45,
      6.2
    ),
    blackMat
  );

  under.position.y=.65;

  g.add(under);


  /* Main train */

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(
      2.55,
      2.15,
      6.2
    ),
    mat(color,.65,.08)
  );

  body.position.y=1.65;

  body.castShadow=true;

  g.add(body);


  /* Lower stripe */

  const stripe=new THREE.Mesh(
    new THREE.BoxGeometry(
      2.59,
      .22,
      6.24
    ),
    mat(0xffffff)
  );

  stripe.position.y=1.05;

  g.add(stripe);


  /* Roof */

  const roof=new THREE.Mesh(
    new THREE.BoxGeometry(
      2.72,
      .25,
      6.35
    ),
    darkMat
  );

  roof.position.y=2.82;

  g.add(roof);


  /* Front windshield */

  const windshield=new THREE.Mesh(
    new THREE.BoxGeometry(
      1.75,
      .78,
      .06
    ),
    windowMat
  );

  windshield.position.set(
    0,
    2.0,
    -3.14
  );

  g.add(windshield);


  /* Front frame */

  const frameTop=new THREE.Mesh(
    new THREE.BoxGeometry(
      1.95,
      .12,
      .12
    ),
    darkMat
  );

  frameTop.position.set(
    0,
    2.45,
    -3.2
  );

  g.add(frameTop);


  /* Headlights */

  for(const x of [-.75,.75]){

    const light=new THREE.Mesh(
      new THREE.CylinderGeometry(
        .16,.16,.08,12
      ),
      new THREE.MeshStandardMaterial({
        color:0xffffd0,
        emissive:0xffff80,
        emissiveIntensity:.8
      })
    );

    light.rotation.x=Math.PI/2;

    light.position.set(
      x,
      1.18,
      -3.2
    );

    g.add(light);

  }


  /* Doors + side windows */

  for(const side of [-1,1]){

    const door=new THREE.Mesh(
      new THREE.BoxGeometry(
        .72,
        1.55,
        .045
      ),
      mat(0x26394b,.45,.15)
    );

    door.position.set(
      side*1.29,
      1.55,
      -.25
    );

    g.add(door);


    for(let i=0;i<3;i++){

      const win=new THREE.Mesh(
        new THREE.BoxGeometry(
          .55,
          .62,
          .045
        ),
        windowMat
      );

      win.position.set(
        side*1.30,
        2.05,
        1.35-i*1.35
      );

      g.add(win);

    }

  }


  /* Graffiti style panels */

  const graffitiColors=[
    0xffd62b,
    0x00e7ff,
    0xff3b91,
    0x7bff4b
  ];

  for(let i=0;i<4;i++){

    const decal=new THREE.Mesh(
      new THREE.BoxGeometry(
        .08,
        .34+Math.random()*.3,
        .5
      ),
      mat(
        graffitiColors[i]
      )
    );

    decal.position.set(
      -1.31,
      1.15+Math.random()*.7,
      2-i*1.3
    );

    decal.rotation.z=
      (Math.random()-.5)*.7;

    g.add(decal);

  }


  /* wheels */

  for(const side of [-1,1]){

    for(const zPos of [-2.15,0,2.15]){

      const wheel=new THREE.Mesh(
        new THREE.CylinderGeometry(
          .32,.32,.15,12
        ),
        blackMat
      );

      wheel.rotation.z=Math.PI/2;

      wheel.position.set(
        side*1.28,
        .48,
        zPos
      );

      g.add(wheel);

    }

  }


  g.position.set(
    LANES[lane],
    0,
    z
  );

  world.add(g);

  trains.push(g);

}


for(let i=0;i<9;i++){

  createTrain(
    Math.floor(Math.random()*3),
    -55-i*58,
    trainColors[
      Math.floor(
        Math.random()*trainColors.length
      )
    ]
  );

}


/* =========================================================
   BARRIERS
========================================================= */

const barriers=[];


function createBarrier(lane,z,high=false){

  const g=new THREE.Group();

  const height=high?2.15:1.15;


  const supportL=new THREE.Mesh(
    new THREE.BoxGeometry(
      .18,
      height,
      .25
    ),
    darkMat
  );

  supportL.position.set(
    -1.05,
    height/2,
    0
  );

  g.add(supportL);


  const supportR=supportL.clone();

  supportR.position.x=1.05;

  g.add(supportR);


  const bar=new THREE.Mesh(
    new THREE.BoxGeometry(
      2.45,
      .5,
      .32
    ),
    mat(0xff2525)
  );

  bar.position.y=height;

  g.add(bar);


  /* white stripes */

  for(let i=0;i<4;i++){

    const stripe=new THREE.Mesh(
      new THREE.BoxGeometry(
        .32,
        .52,
        .35
      ),
      mat(0xffffff)
    );

    stripe.position.set(
      -0.82+i*.55,
      height,
      -.02
    );

    stripe.rotation.z=
      i%2===0?.18:-.18;

    g.add(stripe);

  }


  g.userData.high=high;

  g.position.set(
    LANES[lane],
    0,
    z
  );

  world.add(g);

  barriers.push(g);

}


for(let i=0;i<13;i++){

  createBarrier(
    Math.floor(Math.random()*3),
    -35-i*38,
    Math.random()<.3
  );

}


/* =========================================================
   COINS
========================================================= */

const coins=[];


function createCoin(x,y,z){

  const c=new THREE.Mesh(
    new THREE.TorusGeometry(
      .23,
      .085,
      8,
      16
    ),
    new THREE.MeshStandardMaterial({
      color:0xffd21c,
      metalness:.65,
      roughness:.2
    })
  );

  c.position.set(
    x,y,z
  );

  c.rotation.x=Math.PI/2;

  c.castShadow=true;

  c.userData.collected=false;

  world.add(c);

  coins.push(c);

}


/* patterns */

for(let p=0;p<35;p++){

  const baseZ=-22-p*18;

  const type=p%5;

  if(type===0){

    for(let i=0;i<7;i++){

      createCoin(
        0,
        1.0,
        baseZ-i*1.5
      );

    }

  }
  else if(type===1){

    const lane=Math.floor(
      Math.random()*3
    );

    for(let i=0;i<8;i++){

      createCoin(
        LANES[lane],
        1+Math.sin(i*.8)*.35,
        baseZ-i*1.45
      );

    }

  }
  else if(type===2){

    for(let i=0;i<9;i++){

      const laneIndex=
        Math.min(
          2,
          Math.floor(i/3)
        );

      createCoin(
        LANES[laneIndex],
        1.0+i*.17,
        baseZ-i*1.35
      );

    }

  }
  else if(type===3){

    for(let i=0;i<9;i++){

      const x=
        Math.sin(i*.55)*2.5;

      createCoin(
        x,
        1.1,
        baseZ-i*1.3
      );

    }

  }
  else{

    for(let i=0;i<7;i++){

      createCoin(
        LANES[1],
        1.1+i*.28,
        baseZ-i*1.35
      );

    }

  }

}


/* =========================================================
   POWERUPS
========================================================= */

const powerups=[];

function createPowerup(type,z){

  const group=new THREE.Group();

  let color=0xffffff;

  if(type==="magnet") color=0xff3b5e;
  if(type==="sneaker") color=0x35d8ff;
  if(type==="board") color=0xa83cff;
  if(type==="jet") color=0xff8b16;


  const core=new THREE.Mesh(
    new THREE.OctahedronGeometry(
      .45,
      1
    ),
    new THREE.MeshStandardMaterial({
      color,
      emissive:color,
      emissiveIntensity:.25,
      metalness:.2,
      roughness:.35
    })
  );

  group.add(core);


  group.userData.type=type;

  group.position.set(
    LANES[Math.floor(Math.random()*3)],
    type==="jet"?1.8:1.2,
    z
  );

  world.add(group);

  powerups.push(group);

}


createPowerup("magnet",-110);
createPowerup("sneaker",-280);
createPowerup("board",-440);
createPowerup("jet",-600);


/* =========================================================
   GAME STATE
========================================================= */

let running=false;
let paused=false;
let gameEnded=false;

let score=0;
let coinCount=0;

let speed=8;

let lane=1;
let targetX=LANES[1];
let laneStartX=LANES[1];
let laneTween=1;

let velocityY=0;
let jumping=false;

let rolling=false;
let rollTimer=0;

let magnetTimer=0;
let sneakerTimer=0;
let boardTimer=0;
let jetTimer=0;

let runTime=0;

let lastTime=performance.now();

let touchStartX=0;
let touchStartY=0;
let touchActive=false;

let fallAnimation=false;
let fallTime=0;


/* =========================================================
   START / RESET
========================================================= */

function resetGame(){

  score=0;
  coinCount=0;

  speed=8;

  lane=1;
  targetX=LANES[1];
  laneStartX=LANES[1];
  laneTween=1;

  velocityY=0;
  jumping=false;

  rolling=false;
  rollTimer=0;

  magnetTimer=0;
  sneakerTimer=0;
  boardTimer=0;
  jetTimer=0;

  runTime=0;

  gameEnded=false;
  fallAnimation=false;
  fallTime=0;

  player.position.set(
    0,
    0,
    6
  );

  player.rotation.set(
    0,0,0
  );

  player.scale.set(
    1,1,1
  );

  hoverboard.visible=false;
  jetpack.visible=false;

  trains.forEach((t,i)=>{

    t.position.x=
      LANES[Math.floor(Math.random()*3)];

    t.position.z=
      -55-i*58;

  });


  barriers.forEach((b,i)=>{

    b.position.x=
      LANES[Math.floor(Math.random()*3)];

    b.position.z=
      -35-i*38;

  });


  coins.forEach(c=>{

    c.visible=true;
    c.userData.collected=false;

  });


  powerups.forEach((p,i)=>{

    p.visible=true;

  });


  document.getElementById("score")
    .textContent="0";

  document.getElementById("coinCount")
    .textContent="0";

  updatePowerUI();

}


/* =========================================================
   LANE
========================================================= */

function changeLane(direction){

  if(!running || paused || gameEnded)
    return;

  const newLane=
    Math.max(
      0,
      Math.min(
        2,
        lane+direction
      )
    );

  if(newLane===lane)
    return;

  laneStartX=player.position.x;

  lane=newLane;

  targetX=LANES[lane];

  laneTween=0;

}


/* =========================================================
   JUMP
========================================================= */

function jump(){

  if(!running || paused || gameEnded)
    return;

  if(jetTimer>0)
    return;

  if(jumping || rolling)
    return;

  jumping=true;

  velocityY=
    sneakerTimer>0
      ?11.5
      :9.6;

}


/* =========================================================
   ROLL
========================================================= */

function roll(){

  if(!running || paused || gameEnded)
    return;

  if(jumping && player.position.y>.8)
    return;

  rolling=true;
  rollTimer=.8;

}


/* =========================================================
   POWER UI
========================================================= */

function updatePowerUI(){

  const list=[
    ["magnetPower","magnetTime",magnetTimer],
    ["sneakerPower","sneakerTime",sneakerTimer],
    ["boardPower","boardTime",boardTimer],
    ["jetPower","jetTime",jetTimer]
  ];

  list.forEach(a=>{

    const el=document.getElementById(a[0]);
    const text=document.getElementById(a[1]);

    if(a[2]>0){

      el.style.display="block";

      text.textContent=
        Math.ceil(a[2])+"s";

    }else{

      el.style.display="none";

    }

  });

}


/* =========================================================
   COLLECT POWER
========================================================= */

function collectPower(type){

  if(type==="magnet")
    magnetTimer=10;

  if(type==="sneaker")
    sneakerTimer=10;

  if(type==="board"){

    boardTimer=12;
    hoverboard.visible=true;

  }

  if(type==="jet"){

    jetTimer=8;
    jetpack.visible=true;
    jumping=false;
    velocityY=0;

  }

  updatePowerUI();

}


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

  if(gameEnded)
    return;

  gameEnded=true;
  running=false;

  fallAnimation=true;
  fallTime=.75;

  document.getElementById("finalScore")
    .textContent=Math.floor(score);

  document.getElementById("finalCoins")
    .textContent=coinCount;

}


/* =========================================================
   COLLISION
========================================================= */

function checkCollisions(){

  const px=player.position.x;
  const py=player.position.y;
  const pz=player.position.z;


  /* trains */

  for(const t of trains){

    if(
      Math.abs(t.position.z-pz)<3.7 &&
      Math.abs(t.position.x-px)<1.15
    ){

      if(
        jetTimer<=0 &&
        boardTimer<=0 &&
        !jumping &&
        !rolling
      ){

        endGame();

        return;

      }

    }

  }


  /* barriers */

  for(const b of barriers){

    if(
      Math.abs(b.position.z-pz)<1.3 &&
      Math.abs(b.position.x-px)<1.15
    ){

      if(b.userData.high){

        if(!rolling && jetTimer<=0){

          endGame();

          return;

        }

      }else{

        if(
          player.position.y<1.0 &&
          !jumping &&
          !rolling &&
          jetTimer<=0
        ){

          endGame();

          return;

        }

      }

    }

  }

}


/* =========================================================
   COINS
========================================================= */

function checkCoins(){

  const px=player.position.x;
  const py=player.position.y;
  const pz=player.position.z;

  for(const c of coins){

    if(!c.visible)
      continue;


    let dx=c.position.x-px;
    let dy=c.position.y-(py+1);
    let dz=c.position.z-pz;

    const dist=
      Math.sqrt(
        dx*dx+dy*dy+dz*dz
      );


    if(magnetTimer>0 && dist<7){

      c.position.x +=
        (px-c.position.x)*.16;

      c.position.y +=
        ((py+1)-c.position.y)*.16;

      c.position.z +=
        (pz-c.position.z)*.16;

    }


    if(dist<.72){

      c.visible=false;

      coinCount++;

      score+=10;

      document.getElementById(
        "coinCount"
      ).textContent=coinCount;

    }

  }

}


/* =========================================================
   RECYCLE
========================================================= */

function recycleObjects(){

  const pz=player.position.z;


  trains.forEach((t,i)=>{

    if(t.position.z>pz+25){

      t.position.z=
        pz-420-
        Math.random()*100;

      t.position.x=
        LANES[
          Math.floor(
            Math.random()*3
          )
        ];

    }

  });


  barriers.forEach((b,i)=>{

    if(b.position.z>pz+25){

      b.position.z=
        pz-250-
        Math.random()*90;

      b.position.x=
        LANES[
          Math.floor(
            Math.random()*3
          )
        ];

      b.userData.high=
        Math.random()<.3;

    }

  });


  coins.forEach(c=>{

    if(c.position.z>pz+25){

      c.position.z=
        pz-300-
        Math.random()*120;

      c.position.x=
        LANES[
          Math.floor(
            Math.random()*3
          )
        ];

      c.position.y=
        1+Math.random()*1.2;

      c.visible=true;

    }

  });


  powerups.forEach(p=>{

    if(p.position.z>pz+25){

      p.position.z=
        pz-400-
        Math.random()*200;

      p.position.x=
        LANES[
          Math.floor(
            Math.random()*3
          )
        ];

      p.visible=true;

    }

  });

}


/* =========================================================
   PLAYER ANIMATION
========================================================= */

function animatePlayer(dt){

  runTime+=dt;


  /* Jetpack */

  if(jetTimer>0){

    player.position.y=
      3.2+
      Math.sin(runTime*5)*.22;

    jumping=false;
    rolling=false;

    jetpack.visible=true;

  }else{

    jetpack.visible=false;


    /* Gravity */

    if(jumping){

      velocityY-=22*dt;

      player.position.y+=
        velocityY*dt;

      if(player.position.y<=0){

        player.position.y=0;

        velocityY=0;

        jumping=false;

      }

    }


    /* Roll */

    if(rolling){

      rollTimer-=dt;

      player.scale.y=.55;

      player.position.y=.02;

      player.rotation.z=
        Math.sin(runTime*18)*.12;

      if(rollTimer<=0){

        rolling=false;

        player.scale.y=1;

        player.rotation.z=0;

      }

    }else{

      player.scale.y=1;

      player.rotation.z=0;

    }

  }


  /* Running animation */

  if(
    !jumping &&
    !rolling &&
    jetTimer<=0
  ){

    const swing=
      Math.sin(runTime*13);

    const swing2=
      Math.sin(runTime*13+Math.PI);


    legL.rotation.x=
      swing*.62;

    legR.rotation.x=
      swing2*.62;


    armL.rotation.x=
      swing2*.7;

    armR.rotation.x=
      swing*.7;


    /* tiny natural body movement */

    torso.rotation.z=
      Math.sin(runTime*13)*.035;

    player.position.y=
      Math.abs(
        Math.sin(runTime*13)
      )*.045;

  }


  /* Jump pose */

  if(jumping){

    legL.rotation.x=-.9;
    legR.rotation.x=-.9;

    armL.rotation.x=-.5;
    armR.rotation.x=-.5;

  }


  /* Jetpack pose */

  if(jetTimer>0){

    legL.rotation.x=.15;
    legR.rotation.x=.15;

    armL.rotation.x=-.35;
    armR.rotation.x=-.35;

  }

}


/* =========================================================
   UPDATE POWER
========================================================= */

function updatePowers(dt){

  magnetTimer=
    Math.max(0,magnetTimer-dt);

  sneakerTimer=
    Math.max(0,sneakerTimer-dt);

  boardTimer=
    Math.max(0,boardTimer-dt);

  jetTimer=
    Math.max(0,jetTimer-dt);


  if(boardTimer<=0)
    hoverboard.visible=false;

  updatePowerUI();

}


/* =========================================================
   TRACK ENDLESS RECYCLE
========================================================= */

function recycleTrack(){

  const pz=player.position.z;

  for(const section of trackParts){

    if(
      section.position.z>
      pz+45
    ){

      let minZ=Infinity;

      for(const s of trackParts){

        if(s.position.z<minZ)
          minZ=s.position.z;

      }

      section.position.z=
        minZ-42;

    }

  }

}


/* =========================================================
   CITY RECYCLE
========================================================= */

function recycleCity(){

  const pz=player.position.z;

  for(const b of cityParts){

    if(b.position.z>pz+35){

      let minZ=Infinity;

      for(const other of cityParts){

        if(other.position.z<minZ)
          minZ=other.position.z;

      }

      b.position.z=
        minZ-18;

    }

  }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt){

  const desiredX=
    player.position.x*.28;

  camera.position.x +=
    (desiredX-camera.position.x)
    *Math.min(1,dt*7);


  const desiredY=
    5.25+
    player.position.y*.18;

  camera.position.y +=
    (desiredY-camera.position.y)
    *Math.min(1,dt*6);


  /* camera follows actual player Z */

  const desiredZ=
    player.position.z+9;

  camera.position.z +=
    (desiredZ-camera.position.z)
    *Math.min(1,dt*8);


  camera.lookAt(
    player.position.x*.35,
    1.45+player.position.y*.2,
    player.position.z-20
  );

}


/* =========================================================
   FALL ANIMATION
========================================================= */

function updateFall(dt){

  if(!fallAnimation)
    return;

  fallTime-=dt;

  player.rotation.x=
    Math.min(
      Math.PI*.48,
      player.rotation.x+dt*6
    );

  player.position.y=
    Math.max(
      -.7,
      player.position.y-dt*4
    );

  player.position.z+=
    dt*1.5;


  if(fallTime<=0){

    fallAnimation=false;

    document.getElementById(
      "gameOver"
    ).style.display="flex";

  }

}


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(now){

  requestAnimationFrame(animate);

  const dt=
    Math.min(
      .035,
      (now-lastTime)/1000
    );

  lastTime=now;


  if(running && !paused && !gameEnded){

    /* actual forward running */

    const actualSpeed=
      speed*
      (jetTimer>0?1.12:1);

    player.position.z-=
      actualSpeed*dt;


    /* lane tween 0.2 sec */

    if(laneTween<1){

      laneTween+=dt/.2;

      const t=
        Math.min(1,laneTween);

      const eased=
        1-Math.pow(1-t,3);

      player.position.x=
        laneStartX+
        (targetX-laneStartX)*
        eased;

    }else{

      player.position.x=targetX;

    }


    speed+=dt*.075;

    score+=dt*speed*.9;


    animatePlayer(dt);

    updatePowers(dt);

    checkCoins();

    checkCollisions();

    recycleObjects();

    recycleTrack();

    recycleCity();

    updateCamera(dt);


    document.getElementById(
      "score"
    ).textContent=
      Math.floor(score);

  }


  if(fallAnimation){

    updateFall(dt);

    updateCamera(dt);

  }


  /* coin spin */

  for(const c of coins){

    if(c.visible){

      c.rotation.y+=
        dt*5;

      c.rotation.z+=
        dt*1.5;

    }

  }


  /* power animation */

  for(const p of powerups){

    if(p.visible){

      p.rotation.y+=dt*2.8;

      p.position.y +=
        Math.sin(
          now*.004+p.position.z
        )*.002;

    }

  }


  renderer.render(
    scene,
    camera
  );

}


/* =========================================================
   TOUCH CONTROLS
========================================================= */

renderer.domElement.addEventListener(
  "touchstart",
  e=>{

    if(!running || paused)
      return;

    const t=e.changedTouches[0];

    touchStartX=t.clientX;
    touchStartY=t.clientY;

    touchActive=true;

  },
  {passive:false}
);


renderer.domElement.addEventListener(
  "touchend",
  e=>{

    if(!touchActive)
      return;

    const t=e.changedTouches[0];

    const dx=
      t.clientX-touchStartX;

    const dy=
      t.clientY-touchStartY;

    touchActive=false;

    const ax=Math.abs(dx);
    const ay=Math.abs(dy);


    if(
      Math.max(ax,ay)<50
    )
      return;


    if(ax>ay){

      if(dx>50)
        changeLane(1);

      else if(dx<-50)
        changeLane(-1);

    }else{

      if(dy<-50)
        jump();

      else if(dy>50)
        roll();

    }

    e.preventDefault();

  },
  {passive:false}
);


/* Prevent browser gestures */

document.addEventListener(
  "touchmove",
  e=>{

    if(running)
      e.preventDefault();

  },
  {passive:false}
);


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
  "startBtn"
).onclick=()=>{

  resetGame();

  document.getElementById(
    "startScreen"
  ).style.display="none";

  running=true;
  paused=false;

  showMessage("GO!");

};


document.getElementById(
  "restartBtn"
).onclick=()=>{

  resetGame();

  document.getElementById(
    "gameOver"
  ).style.display="none";

  running=true;
  paused=false;

  showMessage("GO!");

};


document.getElementById(
  "pause"
).onclick=()=>{

  if(!running || gameEnded)
    return;

  paused=!paused;

  document.getElementById(
    "pause"
  ).textContent=
    paused?"▶":"Ⅱ";

  if(paused)
    showMessage("PAUSED");

  else
    hideMessage();

};


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=null;

function showMessage(text){

  const el=
    document.getElementById(
      "message"
    );

  el.textContent=text;

  el.style.display="block";

  clearTimeout(messageTimer);

  messageTimer=setTimeout(
    hideMessage,
    900
  );

}

function hideMessage(){

  document.getElementById(
    "message"
  ).style.display="none";

}


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* =========================================================
   LOADING
========================================================= */

setTimeout(()=>{

  document.getElementById(
    "loading"
  ).style.display="none";

},800);


/* START LOOP */

requestAnimationFrame(animate);

</script>
