<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Rail Rush - Real 3D Runner</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#68c9ff;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#hud{
  position:fixed;
  left:14px;
  top:calc(env(safe-area-inset-top) + 16px);
  z-index:10;
  pointer-events:none;
}

.hudBox{
  min-width:180px;
  margin-bottom:10px;
  padding:12px 18px;
  border-radius:18px;
  color:#fff;
  background:rgba(9,40,72,.90);
  border:2px solid rgba(255,255,255,.20);
  box-shadow:0 7px 20px rgba(0,0,0,.25);
  font-weight:900;
  font-size:22px;
  letter-spacing:.4px;
}

#coinBox{
  color:#ffd52a;
}

#pause{
  position:fixed;
  right:16px;
  top:calc(env(safe-area-inset-top) + 16px);
  z-index:20;
  width:70px;
  height:70px;
  border:0;
  border-radius:20px;
  background:rgba(255,255,255,.94);
  color:#10253c;
  font-size:30px;
  font-weight:900;
  box-shadow:0 7px 20px rgba(0,0,0,.25);
}

#powerBar{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:18px;
  z-index:15;
  display:flex;
  gap:7px;
  max-width:96%;
  flex-wrap:wrap;
  justify-content:center;
  pointer-events:none;
}

.power{
  display:none;
  padding:9px 13px;
  border-radius:18px;
  color:white;
  background:rgba(8,35,65,.88);
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 5px 15px rgba(0,0,0,.25);
  font-size:13px;
  font-weight:900;
}

#message{
  position:fixed;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);
  z-index:30;
  color:#fff;
  font-size:54px;
  font-weight:1000;
  text-shadow:0 4px 15px #000;
  opacity:0;
  pointer-events:none;
  text-align:center;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:linear-gradient(
    rgba(5,25,52,.35),
    rgba(5,20,40,.72)
  );
}

.panel{
  width:min(420px,94vw);
  padding:30px 24px;
  text-align:center;
  border-radius:28px;
  color:#fff;
  background:rgba(7,35,64,.94);
  border:2px solid rgba(255,255,255,.20);
  box-shadow:0 20px 60px rgba(0,0,0,.40);
}

.panel h1{
  font-size:42px;
  margin-bottom:8px;
  letter-spacing:1px;
}

.panel h2{
  font-size:30px;
  margin-bottom:14px;
}

.panel p{
  color:#dcecff;
  line-height:1.55;
  margin:10px 0;
}

.startBtn{
  margin-top:18px;
  width:100%;
  padding:16px;
  border:0;
  border-radius:18px;
  color:#fff;
  background:linear-gradient(135deg,#078cff,#1553ff);
  font-size:21px;
  font-weight:900;
  box-shadow:0 8px 20px rgba(0,100,255,.35);
}

.small{
  margin-top:16px;
  font-size:13px;
  color:#a9c9e8;
}

.hidden{
  display:none!important;
}

#loading{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#69caff;
  color:#fff;
  font-size:22px;
  font-weight:900;
}
</style>
</head>

<body>

<div id="loading">LOADING 3D WORLD...</div>

<div id="hud">
  <div class="hudBox">SCORE <span id="score">0</span></div>
  <div class="hudBox" id="coinBox">🪙 <span id="coins">0</span></div>
</div>

<button id="pause">Ⅱ</button>

<div id="powerBar">
  <div class="power" id="magnetPower">🧲 MAGNET <span>0</span>s</div>
  <div class="power" id="sneakerPower">👟 SNEAKERS <span>0</span>s</div>
  <div class="power" id="boardPower">🛹 BOARD <span>0</span>s</div>
  <div class="power" id="jetPower">🚀 JETPACK <span>0</span>s</div>
</div>

<div id="message"></div>

<div id="startScreen" class="overlay">
  <div class="panel">
    <h1>RAIL RUSH</h1>
    <p>REAL 3D ENDLESS RUNNER</p>
    <p>🏃 Your character runs automatically.</p>
    <p>Swipe <b>← →</b> to change lane</p>
    <p>Swipe <b>↑</b> to jump</p>
    <p>Swipe <b>↓</b> to roll</p>
    <button class="startBtn" id="startBtn">START RUN</button>
    <div class="small">No gameplay control buttons — use the screen.</div>
  </div>
</div>

<div id="gameOver" class="overlay hidden">
  <div class="panel">
    <h2>GAME OVER</h2>
    <p>Score: <b id="finalScore">0</b></p>
    <p>Coins: <b id="finalCoins">0</b></p>
    <button class="startBtn" id="restartBtn">RUN AGAIN</button>
  </div>
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">

import * as THREE from "three";

/* =========================================================
   BASIC SETUP
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x69caff);

scene.fog = new THREE.Fog(
  0x69caff,
  45,
  155
);

const camera = new THREE.PerspectiveCamera(
  67,
  innerWidth / innerHeight,
  0.1,
  300
);

/*
   Camera is behind and above the player.
   The player remains visible near the bottom of screen.
*/
camera.position.set(0,4.8,9.5);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.5)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
========================================================= */

const hemi = new THREE.HemisphereLight(
  0xffffff,
  0x426078,
  2.1
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
  0xffffff,
  2.5
);

sun.position.set(-25,35,20);
sun.castShadow = true;

sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;

sun.shadow.camera.left = -35;
sun.shadow.camera.right = 35;
sun.shadow.camera.top = 35;
sun.shadow.camera.bottom = -35;

scene.add(sun);


/* =========================================================
   MATERIAL HELPERS
========================================================= */

const mat = color =>
  new THREE.MeshStandardMaterial({
    color,
    roughness:.72,
    metalness:.05
  });

const metalMat = color =>
  new THREE.MeshStandardMaterial({
    color,
    roughness:.35,
    metalness:.75
  });

const whiteMat = mat(0xffffff);
const blackMat = mat(0x151922);
const skinMat = mat(0xffbd91);
const hairMat = mat(0x24170f);

const blueMat = mat(0x1387e8);
const jeansMat = mat(0x164a9b);
const shoeMat = mat(0xffffff);


/* =========================================================
   WORLD
========================================================= */

const world = new THREE.Group();
scene.add(world);

const laneX = [-2.5,0,2.5];

const TRACK_LENGTH = 420;


/* Grass */

const grass = new THREE.Mesh(
  new THREE.BoxGeometry(38,.5,TRACK_LENGTH),
  mat(0x4eaf55)
);

grass.position.set(
  0,-.52,-TRACK_LENGTH/2+15
);

grass.receiveShadow = true;

world.add(grass);


/* Railway beds */

for(let lane=0; lane<3; lane++){

  const x = laneX[lane];

  const bed = new THREE.Mesh(
    new THREE.BoxGeometry(3.7,.18,TRACK_LENGTH),
    mat(0x493d3a)
  );

  bed.position.set(
    x,
    -.22,
    -TRACK_LENGTH/2+15
  );

  bed.receiveShadow = true;

  world.add(bed);


  /* Rails */

  [-1.02,1.02].forEach(offset=>{

    const rail = new THREE.Mesh(
      new THREE.BoxGeometry(.14,.20,TRACK_LENGTH),
      metalMat(0xcbd4db)
    );

    rail.position.set(
      x+offset,
      .02,
      -TRACK_LENGTH/2+15
    );

    rail.castShadow = true;
    rail.receiveShadow = true;

    world.add(rail);
  });


  /* Sleepers */

  for(let z=0;z>-TRACK_LENGTH;z-=2.4){

    const sleeper = new THREE.Mesh(
      new THREE.BoxGeometry(3.45,.20,.48),
      mat(0x613a29)
    );

    sleeper.position.set(
      x,
      -.08,
      z
    );

    sleeper.receiveShadow = true;

    world.add(sleeper);
  }
}


/* =========================================================
   SIDE WALK / PLATFORM
========================================================= */

for(const x of [-6.0,6.0]){

  const platform = new THREE.Mesh(
    new THREE.BoxGeometry(
      2.4,
      .35,
      TRACK_LENGTH
    ),
    mat(0x747b86)
  );

  platform.position.set(
    x,
    -.12,
    -TRACK_LENGTH/2+15
  );

  world.add(platform);
}


/* =========================================================
   CITY BUILDINGS
========================================================= */

const buildingColors = [
  0xe84d48,
  0x287ec4,
  0xf0b72d,
  0x35a46d,
  0x8452bb,
  0xe47b3e,
  0x3f9dc5
];

function addBuilding(x,z){

  const width = 3.2 + Math.random()*1.6;
  const height = 7 + Math.random()*11;
  const depth = 4 + Math.random()*2;

  const color =
    buildingColors[
      Math.floor(Math.random()*buildingColors.length)
    ];

  const building = new THREE.Mesh(
    new THREE.BoxGeometry(
      width,
      height,
      depth
    ),
    mat(color)
  );

  building.position.set(
    x,
    height/2-.2,
    z
  );

  building.castShadow = true;
  building.receiveShadow = true;

  world.add(building);


  /* roof */

  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(
      width+.12,
      .22,
      depth+.12
    ),
    blackMat
  );

  roof.position.set(
    x,
    height+.02,
    z
  );

  world.add(roof);


  /* windows */

  for(
    let wy=1.7;
    wy<height-1;
    wy+=2.2
  ){

    for(
      let wx=-width/2+.55;
      wx<width/2-.2;
      wx+=.9
    ){

      const windowMesh = new THREE.Mesh(
        new THREE.BoxGeometry(
          .32,
          .48,
          .035
        ),
        mat(
          Math.random()>.25
          ? 0xffef91
          : 0x9bdcff
        )
      );

      windowMesh.position.set(
        x+wx,
        wy,
        z-depth/2-.02
      );

      world.add(windowMesh);
    }
  }
}


for(let z=5;z>-390;z-=8){

  addBuilding(
    -8.1-Math.random()*1.2,
    z
  );

  addBuilding(
    8.1+Math.random()*1.2,
    z-3
  );
}


/* =========================================================
   STREET LIGHTS
========================================================= */

function addStreetLight(x,z){

  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(.055,.075,3.4,8),
    blackMat
  );

  pole.position.set(x,1.6,z);
  world.add(pole);

  const arm = new THREE.Mesh(
    new THREE.BoxGeometry(.65,.06,.06),
    blackMat
  );

  arm.position.set(
    x+(x<0?.3:-.3),
    3.15,
    z
  );

  world.add(arm);

  const lamp = new THREE.Mesh(
    new THREE.SphereGeometry(.13,8,8),
    mat(0xffe76c)
  );

  lamp.position.set(
    x+(x<0?.6:-.6),
    3.03,
    z
  );

  world.add(lamp);
}

for(let z=0;z>-390;z-=8){

  addStreetLight(-5.15,z);
  addStreetLight(5.15,z-4);
}


/* =========================================================
   PLAYER
========================================================= */

const player = new THREE.Group();

player.position.set(
  0,
  0,
  6
);

scene.add(player);


/*
   We build the character from MANY meshes.
   This makes it look like a cartoon person,
   not a Minecraft box.
*/

const character = new THREE.Group();
player.add(character);


/* pelvis */

const pelvis = new THREE.Mesh(
  new THREE.BoxGeometry(.72,.42,.48),
  jeansMat
);

pelvis.position.y = 1.02;
character.add(pelvis);


/* torso */

const torso = new THREE.Mesh(
  new THREE.CylinderGeometry(
    .48,
    .58,
    1.05,
    10
  ),
  blueMat
);

torso.scale.z = .72;
torso.position.y = 1.63;
torso.castShadow = true;
character.add(torso);


/* shirt front */

const shirtFront = new THREE.Mesh(
  new THREE.BoxGeometry(.63,.58,.04),
  mat(0x20a9ef)
);

shirtFront.position.set(
  0,
  1.65,
  -.40
);

character.add(shirtFront);


/* neck */

const neck = new THREE.Mesh(
  new THREE.CylinderGeometry(.18,.20,.22,10),
  skinMat
);

neck.position.y = 2.20;
character.add(neck);


/* head */

const head = new THREE.Mesh(
  new THREE.SphereGeometry(
    .53,
    20,
    16
  ),
  skinMat
);

head.scale.set(
  .94,
  1.05,
  .90
);

head.position.y = 2.62;
head.castShadow = true;

character.add(head);


/* hair */

const hair = new THREE.Mesh(
  new THREE.SphereGeometry(
    .55,
    18,
    10,
    0,
    Math.PI*2,
    0,
    Math.PI*.55
  ),
  hairMat
);

hair.position.set(
  0,
  2.91,
  .02
);

character.add(hair);


/* cap crown */

const cap = new THREE.Mesh(
  new THREE.SphereGeometry(
    .58,
    18,
    10,
    0,
    Math.PI*2,
    0,
    Math.PI*.48
  ),
  mat(0x1465e8)
);

cap.scale.set(
  1.04,
  .55,
  1
);

cap.position.set(
  0,
  3.02,
  .01
);

character.add(cap);


/* cap visor */

const visor = new THREE.Mesh(
  new THREE.BoxGeometry(
    .68,
    .10,
    .42
  ),
  mat(0x0e4db8)
);

visor.position.set(
  0,
  2.98,
  -.48
);

visor.rotation.x = -.12;

character.add(visor);


/* =========================================================
   LIMBS
========================================================= */

function createArm(side){

  const armGroup = new THREE.Group();

  armGroup.position.set(
    side*.55,
    1.93,
    0
  );

  character.add(armGroup);


  const upper = new THREE.Mesh(
    new THREE.CylinderGeometry(
      .16,
      .18,
      .58,
      10
    ),
    blueMat
  );

  upper.position.y = -.28;
  upper.rotation.z = side*.12;

  armGroup.add(upper);


  const elbow = new THREE.Group();

  elbow.position.y = -.58;
  armGroup.add(elbow);


  const lower = new THREE.Mesh(
    new THREE.CylinderGeometry(
      .14,
      .16,
      .52,
      10
    ),
    skinMat
  );

  lower.position.y = -.25;

  elbow.add(lower);


  const hand = new THREE.Mesh(
    new THREE.SphereGeometry(
      .17,
      12,
      10
    ),
    skinMat
  );

  hand.position.y = -.54;

  elbow.add(hand);


  return armGroup;
}

const leftArm = createArm(-1);
const rightArm = createArm(1);


/* legs */

function createLeg(side){

  const legGroup = new THREE.Group();

  legGroup.position.set(
    side*.23,
    .95,
    0
  );

  character.add(legGroup);


  const thigh = new THREE.Mesh(
    new THREE.CylinderGeometry(
      .18,
      .20,
      .62,
      10
    ),
    jeansMat
  );

  thigh.position.y = -.31;

  legGroup.add(thigh);


  const knee = new THREE.Group();

  knee.position.y = -.63;

  legGroup.add(knee);


  const shin = new THREE.Mesh(
    new THREE.CylinderGeometry(
      .145,
      .16,
      .62,
      10
    ),
    jeansMat
  );

  shin.position.y = -.30;

  knee.add(shin);


  const shoe = new THREE.Mesh(
    new THREE.BoxGeometry(
      .40,
      .20,
      .65
    ),
    shoeMat
  );

  shoe.position.set(
    0,
    -.65,
    -.14
  );

  shoe.castShadow = true;

  knee.add(shoe);


  return legGroup;
}

const leftLeg = createLeg(-1);
const rightLeg = createLeg(1);


/* =========================================================
   RUN ANIMATION
========================================================= */

let runTime = 0;

function updateRunningAnimation(dt){

  if(!gameRunning) return;

  runTime += dt * 12;

  const s = Math.sin(runTime);
  const c = Math.cos(runTime);

  /*
     Opposite arms and legs.
     This is the important part that makes
     the character look like he is ACTUALLY RUNNING.
  */

  leftLeg.rotation.x = s * .72;
  rightLeg.rotation.x = -s * .72;

  leftArm.rotation.x = -s * .62;
  rightArm.rotation.x = s * .62;

  /* knees bend naturally */

  leftLeg.children[1].rotation.x =
    Math.max(0,s) * .38;

  rightLeg.children[1].rotation.x =
    Math.max(0,-s) * .38;

  /* body bounce */

  character.position.y =
    Math.abs(Math.sin(runTime*2)) * .055;

  character.rotation.z =
    Math.sin(runTime) * .025;
}


/* =========================================================
   HOVERBOARD
========================================================= */

const board = new THREE.Group();

const boardBody = new THREE.Mesh(
  new THREE.BoxGeometry(
    1.35,
    .12,
    .45
  ),
  mat(0xff4b22)
);

boardBody.rotation.z = -.04;
board.add(boardBody);

const boardLight1 = new THREE.Mesh(
  new THREE.BoxGeometry(.22,.05,.22),
  mat(0x4beaff)
);

boardLight1.position.x = -.45;
board.add(boardLight1);

const boardLight2 = boardLight1.clone();
boardLight2.position.x = .45;
board.add(boardLight2);

board.position.y = .20;
board.visible = false;

player.add(board);


/* =========================================================
   JETPACK
========================================================= */

const jetpack = new THREE.Group();

const packBody = new THREE.Mesh(
  new THREE.BoxGeometry(
    .55,
    .75,
    .30
  ),
  mat(0x4b5563)
);

packBody.position.set(
  0,
  1.55,
  .42
);

jetpack.add(packBody);

for(const side of [-1,1]){

  const tank = new THREE.Mesh(
    new THREE.CylinderGeometry(
      .11,.13,.65,10
    ),
    metalMat(0xb8c1cc)
  );

  tank.position.set(
    side*.28,
    1.55,
    .43
  );

  jetpack.add(tank);


  const flame = new THREE.Mesh(
    new THREE.ConeGeometry(
      .10,.42,8
    ),
    mat(0xff7a00)
  );

  flame.rotation.x = Math.PI;

  flame.position.set(
    side*.28,
    1.05,
    .43
  );

  jetpack.add(flame);
}

jetpack.visible = false;
player.add(jetpack);


/* =========================================================
   TRAINS
========================================================= */

const trains = [];

const trainColors = [
  0xd82f36,
  0x1976d2,
  0xf0b323,
  0x19a66b,
  0x823bb0
];

function createTrain(lane,z,color){

  const train = new THREE.Group();

  /*
     Long body — much bigger than player.
  */

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(
      3.35,
      3.15,
      8.5
    ),
    mat(color)
  );

  body.position.y = 1.65;
  body.castShadow = true;
  body.receiveShadow = true;

  train.add(body);


  /* rounded/slanted front */

  const front = new THREE.Mesh(
    new THREE.BoxGeometry(
      3.05,
      2.35,
      .35
    ),
    mat(color)
  );

  front.position.set(
    0,
    1.55,
    4.28
  );

  front.rotation.x = -.03;

  train.add(front);


  /* windshield */

  const windshield = new THREE.Mesh(
    new THREE.BoxGeometry(
      2.15,
      1.05,
      .08
    ),
    mat(0x83dcff)
  );

  windshield.position.set(
    0,
    2.25,
    4.48
  );

  train.add(windshield);


  /* windshield frame */

  for(const x of [-1.13,1.13]){

    const frame = new THREE.Mesh(
      new THREE.BoxGeometry(
        .11,
        1.20,
        .12
      ),
      blackMat
    );

    frame.position.set(
      x,
      2.25,
      4.51
    );

    train.add(frame);
  }


  /* side windows */

  for(const side of [-1,1]){

    for(let z2=-3.2;z2<=2.7;z2+=1.35){

      const win = new THREE.Mesh(
        new THREE.BoxGeometry(
          .07,
          1.0,
          .78
        ),
        mat(0x9be8ff)
      );

      win.position.set(
        side*1.71,
        2.12,
        z2
      );

      train.add(win);


      const windowFrame = new THREE.Mesh(
        new THREE.BoxGeometry(
          .09,
          1.13,
          .88
        ),
        blackMat
      );

      windowFrame.position.set(
        side*1.70,
        2.12,
        z2
      );

      /*
         Frame behind window.
      */

      train.add(windowFrame);
      win.position.x += -side*.06;
    }
  }


  /* doors */

  for(const side of [-1,1]){

    const door = new THREE.Mesh(
      new THREE.BoxGeometry(
        .08,
        1.9,
        .9
      ),
      mat(0x3d5364)
    );

/* =========================================================
   LANE MOVEMENT
========================================================= */

function moveLane(dir){

  if(!gameRunning || paused || gameOver)
    return;

  const newLane =
    Math.max(
      0,
      Math.min(
        2,
        lane+dir
      )
    );

  if(newLane===lane)
    return;

  laneStartX=player.position.x;

  lane=newLane;

  targetX=laneX[lane];

  laneTween=0;
}


/* =========================================================
   JUMP
========================================================= */

function jump(){

  if(!gameRunning || paused || gameOver)
    return;

  if(jumping || rolling)
    return;

  if(jetTimer>0)
    return;

  jumping=true;

  velocityY =
    sneakerTimer>0
    ? 11.5
    : jumpPower;

  /*
     Knees tuck up.
  */

  leftLeg.rotation.x=-1.15;
  rightLeg.rotation.x=-1.15;

  leftArm.rotation.x=.7;
  rightArm.rotation.x=-.7;
}


/* =========================================================
   ROLL
========================================================= */

function roll(){

  if(!gameRunning || paused || gameOver)
    return;

  if(jumping || jetTimer>0)
    return;

  rolling=true;
  rollTimer=.8;

  character.scale.y=.52;

  /*
     Body goes low and rotates.
  */

  character.rotation.z=.10;
}


/* =========================================================
   TOUCH SWIPE
========================================================= */

let touchX=0;
let touchY=0;
let touchActive=false;

renderer.domElement.addEventListener(
  "touchstart",
  e=>{

    if(!gameRunning || paused)
      return;

    const t=e.changedTouches[0];

    touchX=t.clientX;
    touchY=t.clientY;

    touchActive=true;

    e.preventDefault();

  },
  {passive:false}
);

renderer.domElement.addEventListener(
  "touchend",
  e=>{

    if(!touchActive)
      return;

    const t=e.changedTouches[0];

    const dx=t.clientX-touchX;
    const dy=t.clientY-touchY;

    touchActive=false;

    const ax=Math.abs(dx);
    const ay=Math.abs(dy);

    /*
       Exact requested swipe threshold:
       50 pixels.
    */

    if(Math.max(ax,ay)<50)
      return;

    if(ax>ay){

      if(dx>0)
        moveLane(1);
      else
        moveLane(-1);

    }else{

      if(dy<0)
        jump();
      else
        roll();
    }

    e.preventDefault();

  },
  {passive:false}
);

/* =========================================================
   PLAYER PHYSICS
========================================================= */

function updatePlayer(dt){

  /*
     Smooth 0.2 second lane tween.
  */

  if(laneTween<1){

    laneTween += dt/LANE_TIME;

    const t=
      Math.min(1,laneTween);

    /*
       smoothstep
    */

    const eased=
      t*t*(3-2*t);

    player.position.x =
      THREE.MathUtils.lerp(
        laneStartX,
        targetX,
        eased
      );

  }else{

    player.position.x=targetX;
  }


  /* jetpack */

  if(jetTimer>0){

    player.position.y =
      3.7+
      Math.sin(
        performance.now()*.008
      )*.18;

    velocityY=0;
    jumping=false;

    jetpack.visible=true;

  }else{

    jetpack.visible=false;

    if(jumping){

      velocityY +=
        gravity*dt;

      player.position.y +=
        velocityY*dt;

      /*
         tuck legs during jump
      */

      leftLeg.rotation.x=-.75;
      rightLeg.rotation.x=-.75;

      leftArm.rotation.x=.45;
      rightArm.rotation.x=-.45;


      if(player.position.y<=0){

        player.position.y=0;

        velocityY=0;
        jumping=false;
      }
    }
  }


  /* rolling */

  if(rolling){

    rollTimer-=dt;

    character.scale.y =
      .52+
      Math.sin(
        (0.8-rollTimer)*20
      )*.025;

    character.rotation.z =
      Math.sin(
        (0.8-rollTimer)*16
      )*.25;

    if(rollTimer<=0){

      rolling=false;

      character.scale.y=1;
      character.rotation.z=0;
    }
  }


  /*
     If not jumping/rolling,
     normal run animation is active.
  */

  if(!jumping && !rolling && jetTimer<=0){

    updateRunningAnimation(dt);
  }
}


/* =========================================================
   MOVE WORLD
========================================================= */

function updateWorld(dt){

  const moveSpeed =
    speed*60*dt;


  [...trains,...obstacles].forEach(
    obj=>{

      obj.position.z += moveSpeed;

      /*
         When object passes camera,
         recycle it far ahead.
      */

      if(obj.position.z>18){

        obj.position.z =
          -250-
          Math.random()*100;

        obj.position.x =
          laneX[
            Math.floor(
              Math.random()*3
            )
          ];
      }
    }
  );


  /* coins */

  coins.forEach(c=>{

    if(c.userData.collected)
      return;

    c.position.z += moveSpeed;

    c.rotation.y += dt*7;

    c.rotation.x =
      Math.sin(
        performance.now()*.004
      )*.15;


    if(c.position.z>20){

      c.position.z =
        -250-
        Math.random()*110;

      c.position.x =
        laneX[
          Math.floor(
            Math.random()*3
          )
        ];

      /*
         Some coins are raised.
      */

      c.position.y =
        Math.random()>.75
        ? 2.0
        : 1.05;

      c.visible=true;
      c.userData.collected=false;
    }
  });


  /* powerups */

  powerups.forEach(p=>{

    p.position.z += moveSpeed;

    p.rotation.y += dt*2;

    if(p.position.z>20){

      p.position.z =
        -180-
        Math.random()*150;

      p.position.x =
        laneX[
          Math.floor(
            Math.random()*3
          )
        ];

      p.visible=true;
    }
  });


  distance += moveSpeed;

  score +=
    moveSpeed*8;


  /*
     Slowly increase speed.
  */

  speed +=
    dt*.003;

  speed=
    Math.min(
      speed,
      maxSpeed
    );
}


/* =========================================================
   COIN COLLISION
========================================================= */

function collectCoins(){

  const px=player.position.x;
  const py=player.position.y;
  const pz=player.position.z;

  coins.forEach(c=>{

    if(c.userData.collected)
      return;

    let dx =
      c.position.x-px;

    let dy =
      c.position.y-(py+1.1);

    let dz =
      c.position.z-pz;


    /*
       Magnet increases collection radius.
    */

    const radius =
      magnetTimer>0
      ? 3.2
      : .85;


    if(
      Math.abs(dx)<radius &&
      Math.abs(dy)<1.4 &&
      Math.abs(dz)<1.25
    ){

      c.userData.collected=true;
      c.visible=false;

      coinCount++;

      score+=10;
    }
  });
}


/* =========================================================
   POWERUP COLLISION
========================================================= */

function collectPowerups(){

  powerups.forEach(p=>{

    if(!p.visible)
      return;

    const dx =
      p.position.x-player.position.x;

    const dy =
      p.position.y-
      (player.position.y+1);

    const dz =
      p.position.z-player.position.z;

    if(
      Math.abs(dx)<1.2 &&
      Math.abs(dy)<1.8 &&
      Math.abs(dz)<1.4
    ){

      p.visible=false;

      activatePower(
        p.userData.type
      );
    }
  });
}


/* =========================================================
   TRAIN COLLISION
========================================================= */

function trainCollision(){

  /*
     Jetpack means player is flying
     above trains.
  */

  if(jetTimer>0)
    return false;


  for(const train of trains){

    const dx =
      Math.abs(
        train.position.x-
        player.position.x
      );

    const dz =
      Math.abs(
        train.position.z-
        player.position.z
      );

    /*
       Train is intentionally wide
       and long.
    */

    if(
      dx<1.48 &&
      dz<4.15
    ){

      /*
         Hoverboard can save the player
         once from a train collision.
      */

      if(boardTimer>0){

        boardTimer=0;
        board.visible=false;

        train.position.z-=2.5;

        showMessage(
          "💥 BOARD SAVE!",
          700
        );

        return false;
      }

      return true;
    }
  }

  return false;
}


/* =========================================================
   OBSTACLE COLLISION
========================================================= */

function obstacleCollision(){

  for(const o of obstacles){

    const dx =
      Math.abs(
        o.position.x-
        player.position.x
      );

    const dz =
      Math.abs(
        o.position.z-
        player.position.z
      );

    if(
      dx<1.30 &&
      dz<1.15
    ){

      if(o.userData.type==="low"){

        /*
           Low barrier needs jump.
        */

        if(
          player.position.y<1.05
        ){

          if(boardTimer>0){

            boardTimer=0;
            board.visible=false;

            showMessage(
              "💥 BOARD SAVE!",
              600
            );

            return false;
          }

          return true;
        }

      }else{

        /*
           High barrier needs roll.
        */

        if(!rolling){

          if(boardTimer>0){

            boardTimer=0;
            board.visible=false;

            showMessage(
              "💥 BOARD SAVE!",
              600
            );

            return false;
          }

          return true;
        }
      }
    }
  }

  return false;
}


/* =========================================================
   POWER TIMERS
========================================================= */

function updatePowerTimers(dt){

  magnetTimer=
    Math.max(
      0,
      magnetTimer-dt
    );

  sneakerTimer=
    Math.max(
      0,
      sneakerTimer-dt
    );

  boardTimer=
    Math.max(
      0,
      boardTimer-dt
    );

  jetTimer=
    Math.max(
      0,
      jetTimer-dt
    );

  board.visible=
    boardTimer>0;

  if(
    jetTimer<=0
  ){

    jetpack.visible=false;

  }else{

    jetpack.visible=true;
  }

  updateHUD();
}


/* =========================================================
   FALL ANIMATION
========================================================= */

function updateFall(dt){

  if(!falling)
    return;

  fallTime+=dt;

  player.position.y +=
    velocityY*dt;

  velocityY+=
    gravity*dt;

  character.rotation.x +=
    dt*4.2;

  character.rotation.z +=
    dt*1.3;


  if(fallTime>.75){

    falling=false;

    document.getElementById(
      "finalScore"
    ).textContent=
      Math.floor(score);

    document.getElementById(
      "finalCoins"
    ).textContent=
      coinCount;

    document.getElementById(
      "gameOver"
    ).classList.remove("hidden");
  }
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt){

  /*
     Camera follows lane smoothly.
  */

  const desiredX =
    player.position.x*.30;

  camera.position.x +=
    (desiredX-camera.position.x)*
    Math.min(1,dt*6);


  /*
     Slight vertical movement.
  */

  const desiredY =
    4.75+
    player.position.y*.12;

  camera.position.y +=
    (desiredY-camera.position.y)*
    Math.min(1,dt*5);


  camera.lookAt(
    player.position.x*.18,
    1.55+
    player.position.y*.15,
    -15
  );
}


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(){

  requestAnimationFrame(animate);

  const dt =
    Math.min(
      clock.getDelta(),
      .033
    );


  if(gameOver){

    updateFall(dt);

    updateCamera(dt);

    renderer.render(
      scene,
      camera
    );

    return;
  }


  if(!gameRunning){

    /*
       Idle breathing animation
       on start screen.
    */

    runTime+=dt*2;

    character.position.y =
      Math.sin(runTime)*.025;

    renderer.render(
      scene,
      camera
    );

    return;
  }


  if(paused){

    renderer.render(
      scene,
      camera
    );

    return;
  }


  updatePlayer(dt);

  updateWorld(dt);

  collectCoins();

  collectPowerups();

  updatePowerTimers(dt);

  updateCamera(dt);


  /*
     Collision after movement.
  */

  if(
    trainCollision() ||
    obstacleCollision()
  ){

    endGame();
  }


  renderer.render(
    scene,
    camera
  );
}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById("startBtn")
  .addEventListener(
    "click",
    startGame
  );

document.getElementById("restartBtn")
  .addEventListener(
    "click",
    startGame
  );


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* =========================================================
   START
========================================================= */

document.getElementById("loading")
  .style.display="none";

resetGame();

animate();

</script>
